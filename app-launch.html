<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGI Gemology Connect</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1B2E">
<link rel="icon" href="/assets/icons/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0D1B2E;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 24px; gap: 40px;
  }
  .logo { width: min(260px, 70vw); height: auto; margin-bottom: 8px; }
  .tagline { color: #C9A84C; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: -28px; text-align: center; }
  .choices { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .choice {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 14px;
    padding: 18px 20px;
    color: #F5F5F0;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .choice:active { transform: scale(0.98); background: rgba(201,168,76,0.18); }
  .choice .icon {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    background: #C9A84C;
    color: #0D1B2E;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
  }
  .choice .label { flex: 1; }
  .choice .arrow { color: #C9A84C; font-size: 18px; }
  .footer { color: #6b7280; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <img class="logo" src="/assets/igi-school-of-gemology-white-logo.png" alt="IGI School of Gemology">
  <div class="choices">
    <a class="choice" href="/student">
      <span class="icon">S</span>
      <span class="label">Student Portal</span>
      <span class="arrow">&rsaquo;</span>
    </a>
    <a class="choice" href="/counselor">
      <span class="icon">C</span>
      <span class="label">Counsellor Portal</span>
      <span class="arrow">&rsaquo;</span>
    </a>
    <a class="choice" href="/instructor-portal">
      <span class="icon">I</span>
      <span class="label">Instructor Portal</span>
      <span class="arrow">&rsaquo;</span>
    </a>
  </div>
  <div class="footer">IGI School of Gemology</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').then(function(reg){ reg.update(); }).catch(function(){});
  });
}
</script>
</body>
</html>
