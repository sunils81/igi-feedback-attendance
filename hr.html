<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGI SOG — Performance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="assets/shared.js?v=66"></script>
  <style>
    :root {
      --navy:#0D1B2E; --navy2:#1A2F4E; --gold:#C9A84C; --gold-lt:#F5ECD0;
      --white:#fff; --off:#F8F6F1; --border:#E8E3D8; --muted:#7A7060;
      --green:#059669; --lime:#84cc16; --amber:#d97706; --red:#dc2626; --gold-hit:#b45309;
      --r-sm:8px; --r-md:16px; --r-lg:28px;
      --shadow:0 10px 32px rgba(13,27,46,0.08); --shadow-hover:0 16px 40px rgba(13,27,46,0.14);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--off);color:var(--navy);font-size:13px;}

    /* ── Login ─────────────────────────────────────── */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D1B2E 0%,#1a3a5c 100%);}
    .login-box{background:#fff;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
    .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .login-logo img{height:38px;filter:invert(1) brightness(0) invert(0.12);}
    .login-logo-text{font-size:13px;font-weight:800;color:var(--navy);line-height:1.2;}
    .login-logo-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
    .login-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px;}
    .login-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
    .field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--navy);background:var(--off);}
    .field input:focus{outline:none;border-color:var(--gold);}
    .login-btn{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
    .login-btn:hover{background:#1a3a5c;}
    .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}

    /* ── App shell ──────────────────────────────────── */
    #app{display:none;}

    /* Hero band — portal identity, sits above the sticky topbar */
    .site-header{max-width:1260px;margin:16px auto 0;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--r-lg);box-shadow:0 20px 48px rgba(13,27,46,.20);position:relative;overflow:hidden;padding:22px 26px;}
    .site-header::after{content:'';position:absolute;left:26px;right:26px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);}
    .hdr-logo{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
    .hdr-logo img{height:32px;width:auto;}
    .hdr-band{text-align:center;padding-bottom:4px;}
    .hdr-label{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:#fff;}
    .hdr-sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.04em;text-transform:uppercase;margin-top:6px;}

    /* .topbar background spans full width (sticky nav bar), but its content is
       constrained to match .site-header above it — otherwise the hero band looks
       inset while the bar right below it stretches edge-to-edge. */
    .topbar{background:var(--navy);color:#fff;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
    .topbar-inner{max-width:1260px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;}
    .topbar-brand{display:flex;align-items:center;gap:10px;}
    .topbar-brand img{height:26px;filter:brightness(0) invert(1) opacity(.85);}
    .topbar-title{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.02em;}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .topbar-badge{font-size:10px;font-weight:700;background:var(--gold);color:var(--navy);padding:2px 8px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;}

    /* ── Controls bar ──────────────────────────────── */
    .controls-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:0;flex-wrap:wrap;min-height:48px;}
    .ctrl-group{display:flex;align-items:center;gap:0;border-right:1px solid var(--border);padding:8px 16px 8px 0;margin-right:16px;}
    .ctrl-group:last-child{border-right:none;margin-left:auto;}
    .ctrl-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-right:8px;white-space:nowrap;}
    /* Period filter buttons */
    .pf-btn{padding:5px 11px;border:1.5px solid var(--border);border-radius:6px;background:var(--off);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-right:4px;transition:all .15s;}
    .pf-btn:hover{border-color:var(--gold);color:var(--navy);}
    .pf-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy);}
    /* Toggle switches */
    .toggle-group{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;}
    .tg-btn{padding:5px 12px;border:none;background:var(--off);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border-right:1px solid var(--border);}
    .tg-btn:last-child{border-right:none;}
    .tg-btn:hover{background:var(--gold-lt);color:var(--navy);}
    .tg-btn.active{background:var(--navy);color:var(--gold);}
    /* Currency pill */
    .cur-pill{display:flex;background:var(--off);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;}
    .cur-opt{padding:4px 12px;font-size:11px;font-weight:700;color:var(--muted);transition:all .15s;}
    .cur-opt.active{background:var(--navy);color:var(--gold);border-radius:18px;}

    /* ── Main layout ───────────────────────────────── */
    .main{max-width:1260px;margin:0 auto;padding:20px 24px 60px;}
    .section-head{margin:28px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--navy);}
    .section-head h2{font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
    .section-head p{font-size:10px;color:var(--muted);}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}

    /* ── National dark banner ──────────────────────── */
    .nat-banner{background:linear-gradient(135deg,#0D1B2E 0%,#18304e 100%);border-radius:14px;padding:22px 28px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;}
    .nat-banner::before{content:'';position:absolute;top:-50px;right:-50px;width:220px;height:220px;border-radius:50%;background:rgba(201,168,76,.06);}
    .nb-row1{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
    .nb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45);}
    .nb-period-tag{font-size:10px;font-weight:700;background:rgba(201,168,76,.2);color:var(--gold);padding:3px 9px;border-radius:999px;letter-spacing:.06em;}
    .nb-figures{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .nb-big{font-size:40px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;line-height:1;}
    .nb-of{font-size:14px;color:rgba(255,255,255,.45);margin:0 4px;}
    .nb-bp{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.65);}
    .nb-pct-big{font-size:32px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-left:auto;align-self:center;padding-left:16px;}
    .nb-track{background:rgba(255,255,255,.1);border-radius:99px;height:7px;margin-bottom:14px;overflow:hidden;}
    .nb-fill{height:100%;border-radius:99px;transition:width .8s ease;}
    .nb-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
    .nb-col{display:flex;flex-direction:column;gap:3px;}
    .nb-col label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .nb-col .val{font-size:15px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;}
    .nb-col .sub{font-size:10px;color:rgba(255,255,255,.45);}
    .nb-col .up{color:#4ade80;} .nb-col .dn{color:#f87171;}

    /* ── KPI strip ─────────────────────────────────── */
    .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
    .kpi-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px;position:relative;overflow:hidden;}
    .kpi-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
    .kpi-card.green::after{background:var(--green);}
    .kpi-card.amber::after{background:var(--amber);}
    .kpi-card.red::after{background:var(--red);}
    .kpi-icon{font-size:18px;margin-bottom:6px;}
    .kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px;}
    .kpi-value{font-size:20px;font-weight:800;color:var(--navy);line-height:1.1;}
    .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px;}

    /* ── Leaderboard table ──────────────────────────── */
    .lb-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
    .lb-table{width:100%;border-collapse:collapse;min-width:700px;}
    .lb-table th{background:var(--navy);color:rgba(255,255,255,.6);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;font-weight:700;white-space:nowrap;}
    .lb-table th:first-child{border-radius:0;}
    .lb-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
    .lb-table tr:last-child td{border-bottom:none;}
    .lb-table tr:hover td{background:rgba(201,168,76,.03);}
    .lb-table .num{font-family:'JetBrains Mono',monospace;font-size:12px;}
    .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;}
    .rank-1{background:linear-gradient(135deg,#FFD700,#f5c000);color:#5a3e00;box-shadow:0 2px 6px rgba(255,215,0,.4);}
    .rank-2{background:linear-gradient(135deg,#C0C0C0,#a8a8a8);color:#3a3a3a;}
    .rank-3{background:linear-gradient(135deg,#CD7F32,#b06020);color:#fff;}
    .rank-n{background:var(--border);color:var(--muted);}
    .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
    .pill-gold {background:#fef3c7;color:#92400e;}
    .pill-green{background:#dcfce7;color:#059669;}
    .pill-lime {background:#f0fdf4;color:#65a30d;}
    .pill-amber{background:#fff7ed;color:#c2410c;}
    .pill-red  {background:#fee2e2;color:#b91c1c;}
    .pill-grey {background:var(--border);color:var(--muted);}
    /* Dynamic bar in leaderboard */
    .bar-cell{display:flex;align-items:center;gap:8px;min-width:160px;}
    .bar-track{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;position:relative;}
    .bar-bp{position:absolute;left:0;top:0;height:100%;background:rgba(201,168,76,.25);border-radius:5px;}
    .bar-ach{position:absolute;left:0;top:0;height:100%;border-radius:5px;}
    .bar-val{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--navy);white-space:nowrap;}

    /* ── Revenue chart section ──────────────────────── */
    .rbar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .rbar-row:last-child{border-bottom:none;}
    .rbar-name{width:130px;font-size:12px;font-weight:700;flex-shrink:0;}
    .rbar-sub{font-size:9px;color:var(--muted);font-weight:400;}
    .rbar-chart{flex:1;position:relative;height:18px;}
    .rbar-track{position:absolute;left:0;top:50%;transform:translateY(-50%);height:10px;background:var(--border);border-radius:5px;}
    .rbar-bp-mark{position:absolute;top:50%;transform:translateY(-50%);width:2px;height:16px;background:rgba(201,168,76,.6);border-radius:1px;}
    .rbar-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:10px;border-radius:5px;transition:width .7s ease;}
    .rbar-nums{display:flex;align-items:baseline;gap:5px;flex-shrink:0;min-width:140px;justify-content:flex-end;}
    .rbar-ach{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);}
    .rbar-bp{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    .rbar-pct{flex-shrink:0;width:58px;text-align:right;}

    /* ── Scorecards — McKinsey redesign ─────────────── */
    .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
    .sc-card{background:#fff;border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left-width:3px;border-left-style:solid;}
    .sc-header{padding:13px 16px 10px;}
    .sc-hdr-row{display:flex;justify-content:space-between;align-items:center;}
    .sc-name{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.01em;}
    .sc-rank-tag{font-size:10px;font-weight:700;color:var(--muted);background:var(--off);border:1px solid var(--border);padding:2px 7px;border-radius:3px;}
    .sc-loc{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.01em;}
    .sc-revenue-block{padding:10px 16px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--off);}
    .sc-rev-main{display:flex;align-items:baseline;justify-content:space-between;}
    .sc-rev-ach{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);letter-spacing:-.02em;}
    .sc-rev-period{font-size:10px;color:var(--muted);margin-left:6px;}
    .sc-pct-big{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;}
    .sc-bp-line{font-size:10px;color:var(--muted);margin-top:3px;}
    .sc-ach-track{height:3px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden;}
    .sc-ach-fill{height:100%;border-radius:99px;}
    .sc-body{padding:10px 16px 12px;}
    .sc-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:10px;}
    .sc-mi{padding:7px 10px;border-right:1px solid var(--border);}
    .sc-mi:last-child{border-right:none;}
    .sc-mi label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:3px;}
    .sc-mi strong{font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);}
    .sc-meta2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;overflow:hidden;margin-bottom:10px;}
    .sc-meta2 .sc-mi{border-top:1px solid var(--border);}
    .spark-wrap{margin-top:2px;}
    .spark-head{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;}
    .spark{display:flex;align-items:flex-end;gap:2px;height:24px;}
    .spark-bar{flex:1;border-radius:1px 1px 0 0;min-height:2px;}
    .spark-labels{display:flex;gap:2px;margin-top:3px;}
    .spark-lbl{flex:1;text-align:center;font-size:7px;color:var(--muted);}

    /* ── Centre cards — McKinsey redesign ───────────── */
    .centre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
    .cc-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .cc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    .cc-name{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.01em;}
    .cc-rank-tag{font-size:9px;font-weight:700;color:var(--muted);}
    .cc-metric-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
    .cc-pct{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;letter-spacing:-.02em;}
    .cc-vs-label{font-size:10px;color:var(--muted);}
    .cc-rev{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--navy);}
    .cc-bp-val{font-size:10px;color:var(--muted);font-weight:400;font-family:'JetBrains Mono',monospace;}
    .cc-bar{height:3px;background:var(--border);border-radius:99px;margin:8px 0 6px;overflow:hidden;}
    .cc-bar-fill{height:100%;border-radius:99px;}
    .cc-py-row{display:flex;justify-content:space-between;align-items:center;}
    .cc-py-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .cc-py-val{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}

    /* ── 8-year historical chart ─────────────────────── */
    .hist-wrap{position:relative;height:280px;}

    /* ── Responsive ──────────────────────────────────── */
    @media(max-width:900px){
      .kpi-strip{grid-template-columns:repeat(2,1fr);}
      .nb-cols{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:600px){
      .main{padding:12px 12px 40px;}
      .kpi-strip{grid-template-columns:1fr 1fr;}
      .nb-figures{gap:6px;}
      .nb-big{font-size:28px;}
    }
    @media print{
      .site-header,.topbar,.controls-bar{display:none!important;}
      body{background:#fff;}
      .main{padding:0;max-width:100%;}
    }
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/igi-school-of-gemology-white-logo.png" onerror="this.style.display='none'" style="height:34px;filter:invert(1) brightness(0)">
      <div>
        <div class="login-logo-text">IGI SOG</div>
        <div class="login-logo-sub">Performance Portal</div>
      </div>
    </div>
    <div class="login-title">Sign in</div>
    <div class="login-sub">HR access · Performance & Revenue</div>
    <div class="field"><label>Name</label><input id="hr-name" placeholder="HR" autocomplete="off"></div>
    <div class="field"><label>PIN</label><input id="hr-pin" type="password" placeholder="••••••••" autocomplete="off"></div>
    <button class="login-btn" onclick="doLogin()">Access Portal</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────── -->
<div id="app">
  <!-- Hero -->
  <div class="site-header">
    <div class="hdr-logo"><img src="assets/igi-school-of-gemology-white-logo.svg" onerror="this.style.display='none'"></div>
    <div class="hdr-band">
      <div class="hdr-label">HR Performance Portal</div>
      <div class="hdr-sub">Instructor & Team Performance — IGI School of Gemology</div>
    </div>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <img src="assets/igi-school-of-gemology-white-logo.png" onerror="this.style.display='none'" style="height:32px">
        <span class="topbar-title">IGI SOG Performance Portal</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-badge">CONFIDENTIAL</span>
        <span id="topbar-user" style="font-size:12px;color:rgba(255,255,255,.5)"></span>
        <button style="background:transparent;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);padding:4px 10px;border-radius:5px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer" onclick="doLogout()">Sign out</button>
      </div>
    </div>
  </div>

  <!-- Controls bar -->
  <div class="controls-bar">
    <!-- Period filter -->
    <div class="ctrl-group">
      <span class="ctrl-label">Period</span>
      <select id="period-select" onchange="setPeriodSelect(this)" style="padding:5px 28px 5px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--off);color:var(--navy);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%228%22 viewBox=%220 0 12 8%22><path d=%22M1 1l5 5 5-5%22 stroke=%22%237A7060%22 stroke-width=%221.5%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>');background-repeat:no-repeat;background-position:right 8px center;">

// ── Auth ─────────────────────────────────────────────────
function doLogin() {
  var name = document.getElementById('hr-name').value.trim();
  var pin  = document.getElementById('hr-pin').value.trim();
  document.getElementById('login-err').textContent = '';

      document.getElementById('login-err').textContent = (d && d.reason) || 'Incorrect credentials — HR PIN required';

  document.getElementById('hr-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
});
function doLogout() {
  location.reload();

// ── Period / Compare / Currency controls ─────────────────
function setPeriodSelect(sel) {
  gPeriod = sel.value;
  loadDashboard();
}
function setCompare(mode) {
  gCompare = mode;

  document.getElementById('cmp-py').classList.toggle('active', mode==='py');
  if (gData) renderDashboard(gData); // re-render with same data, different compare column

  gCurrency = gCurrency === 'inr' ? 'usd' : 'inr';

// ── Format helpers ────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtAmt(lakh) {
  if (gCurrency === 'usd') {
    var k = lakh * LAKH_TO_USD_K;
    return k.toFixed(1);
  }
  return '₹' + lakh.toFixed(1) + 'L';
}
function fmtAmtCr(cr) {
  if (gCurrency === 'usd') {
    var k = cr * 100 * LAKH_TO_USD_K;
    return k.toFixed(0) + 'k';
  }
  return '₹' + cr.toFixed(2) + ' Cr';
}
function fmtUnit() { return gCurrency==='usd' ? 'USD ($000)' : '₹ Lakhs'; }
function growthTag(pct) {
  if (pct === null || pct === undefined) return '<span style="color:var(--muted);font-size:10px">—</span>';
  var col = pct >= 0 ? '#059669' : '#dc2626';
  var arrow = pct >= 0 ? '▲' : '▼';
  return '<span style="font-size:10px;font-weight:700;color:'+col+'">'+arrow+' '+Math.abs(pct)+'%</span>';
}

// Dynamic color for % achievement
function statusColor(pct) {
  if (pct >= 120) return { pill:'pill-gold',  bar:'#059669', text:'#065f46' };  // outstanding — deep green
  if (pct >= 100) return { pill:'pill-green', bar:'#10b981', text:'#059669' };  // on/above target — emerald
  if (pct >= 75)  return { pill:'pill-lime',  bar:'#34d399', text:'#059669' };  // on track — medium green
  if (pct >= 50)  return { pill:'pill-lime',  bar:'#6ee7b7', text:'#047857' };  // above halfway — light green
  return              { pill:'pill-red',   bar:'#94a3b8', text:'#b91c1c' };     // lagging — grey
}
function cardClass(status) {
  return { gold:'gold', green:'green', lime:'lime', amber:'amber', red:'red' }[status] || 'red';
}

// ── Load data from backend ────────────────────────────────
function loadDashboard() {
  document.getElementById('main-content').innerHTML =
    '<div style="text-align:center;padding:60px;color:var(--muted)"><div style="display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px"></div><div>Loading…</div></div>';
  gasGet({ action:'getHRDashboard', periodFilter:gPeriod }, function(err, d) {

      var msg = err ? err.message : (d ? 'status='+d.status+(d.message?' · '+d.message:'') : 'no data');
      document.getElementById('main-content').innerHTML = '<div style="padding:40px;color:var(--red)"><strong>Error:</strong> '+msg+'</div>';

// ── Render ────────────────────────────────────────────────

  html += '<div class="nb-track"><div class="nb-fill" style="width:'+fillW+'%;background:'+sc.bar+'"></div></div>';
  html += '<div class="nb-cols">';
  html += '<div class="nb-col"><label>Achieved</label><span class="val">'+fmtAmtCr(achCr)+'</span><span class="sub">'+pl+'</span></div>';
  if (isBP) {
    html += '<div class="nb-col"><label>Business Plan (BP)</label><span class="val">'+fmtAmtCr(bpCr)+'</span><span class="sub">Annual BP: '+fmtAmtCr(5.5)+'</span></div>';
    html += '<div class="nb-col"><label>vs Annual BP</label><span class="val">'+annVsBP+'%</span><span class="sub">'+fmtAmtCr(gapCr||0)+' gap</span></div>';

  } else {
    html += '<div class="nb-col"><label>Prior Year (PY)</label><span class="val">'+fmtAmtCr(pyAchCr)+'</span><span class="sub">same period</span></div>';
    html += '<div class="nb-col"><label>Growth vs PY</label><span class="val '+(growth>=0?'up':'dn')+'">'+(growth!==null?(growth>=0?'▲':'▼')+Math.abs(growth||0)+'%':'—')+'</span><span class="sub">YoY change</span></div>';
    html += '<div class="nb-col"><label>Top Performer</label><span class="val" style="font-size:13px">'+esc(n.topPerformer?n.topPerformer.name:'—')+'</span><span class="sub">highest earner</span></div>';

    var pyStr = (g!==null) ? ((g>=0?'↑ ':'↓ ')+Math.abs(g)+'% vs PY') : '—';
    html += '<div class="cc-card">';
    html += '<div class="cc-header"><span class="cc-name">'+esc(c.centre)+'</span><span class="cc-rank-tag">#'+c.rank+'</span></div>';
    html += '<div class="cc-metric-row"><span class="cc-pct" style="color:'+sc2.bar+'">'+c.vsBP+'%</span><span class="cc-vs-label">vs BP</span></div>';
    html += '<div style="margin-bottom:2px"><span class="cc-rev">'+fmtAmt(c.achLakh)+'</span> <span class="cc-bp-val">/ '+fmtAmt(c.bpLakh)+'</span></div>';
    html += '<div class="cc-bar"><div class="cc-bar-fill" style="width:'+Math.min(c.vsBP||0,100)+'%;background:'+sc2.bar+'"></div></div>';
    html += '<div class="cc-py-row"><span class="cc-py-label">vs PY</span><span class="cc-py-val" style="color:'+pyCol+'">'+pyStr+'</span></div>';
    html += '</div>';
  });
  html += '</div>';

  // ── 6. Individual Scorecards ─────────────────────────────
  html += '<div class="section-head" style="margin-top:28px"><h2>Individual Scorecards</h2><p>Revenue, BP comparison, monthly trend</p></div>';
  html += '<div class="sc-grid">';
  cs.forEach(function(c) {
    var pct     = isBP ? c.vsBP : (c.vsPY||0);
    var colorPct= isBP ? (c.paceVsBP||c.vsBP||0) : (c.vsPY||0);
    var sc2     = statusColor(colorPct);
    var bpSc    = statusColor(isBP ? (c.paceVsBP||c.vsBP||0) : (c.vsBP||0));
    var ti      = c.trend==='up'?'↑ Improving':c.trend==='down'?'↓ Declining':'→ Stable';
    var tc      = c.trend==='up'?'var(--green)':c.trend==='down'?'#dc2626':'var(--muted)';
    var last6   = c.last6||[];
    var maxV    = Math.max.apply(null,last6.map(function(x){return x.pct;}).concat([1]));
    var achW    = Math.min(pct,100);
    html += '<div class="sc-card" style="border-left-color:'+sc2.bar+'">';
    // Header
    html += '<div class="sc-header">';
    html += '<div class="sc-hdr-row"><span class="sc-name">'+esc(c.name)+'</span><span class="sc-rank-tag">Rank #'+c.rank+'</span></div>';
    html += '<div class="sc-loc">'+esc(c.centre)+' &nbsp;·&nbsp; '+pl+'</div>';
    html += '</div>';
    // Revenue block
    html += '<div class="sc-revenue-block">';
    html += '<div class="sc-rev-main">';
    html += '<span class="sc-rev-ach">'+fmtAmt(c.achLakh)+'</span>';
    html += '<span class="sc-pct-big" style="color:'+sc2.bar+'">'+pct+'%</span>';
    html += '</div>';
    html += '<div class="sc-bp-line">BP: '+fmtAmt(c.bpLakh)+'&nbsp;&nbsp;Annual BP: '+fmtAmt(c.annBPLakh||0)+'</div>';
    html += '<div class="sc-ach-track"><div class="sc-ach-fill" style="width:'+achW+'%;background:'+sc2.bar+'"></div></div>';
    html += '</div>';
    // Metrics grid — row 1
    html += '<div class="sc-body">';
    html += '<div class="sc-meta">';
    html += '<div class="sc-mi"><label>VS BP</label><strong style="color:'+bpSc.bar+'">'+c.vsBP+'%</strong></div>';
    html += '<div class="sc-mi"><label>Q1 VS BP</label><strong style="color:'+statusColor(c.q1VsBP||0).bar+'">'+c.q1VsBP+'%</strong></div>';
    html += '<div class="sc-mi" style="border-right:none"><label>Trend</label><strong style="color:'+tc+';font-size:11px">'+ti+'</strong></div>';
    html += '</div>';
    // Metrics grid — row 2
    html += '<div class="sc-meta2">';
    var pySc = statusColor(c.vsPY||0);
    html += '<div class="sc-mi"><label>PY Revenue</label><strong>'+fmtAmt(c.pyLakh)+'</strong></div>';
    html += '<div class="sc-mi"><label>VS PY</label><strong style="color:'+(c.vsPY!==null?pySc.bar:'var(--muted)')+'">'+( c.vsPY!==null ? c.vsPY+'%' : '—')+'</strong></div>';
    html += '<div class="sc-mi" style="border-right:none"><label>Annual BP</label><strong>'+fmtAmt(c.annBPLakh||0)+'</strong></div>';
    html += '</div>';
    // Sparkline
    if (last6.length) {
      html += '<div class="spark-wrap">';
      html += '<div class="spark-head">Monthly trend vs BP</div>';
      html += '<div class="spark">';
      last6.forEach(function(m) {
        var h  = maxV>0?Math.max(Math.round(m.pct/maxV*100),4):4;
        var mc = !m.hasData?'var(--border)':statusColor(m.pct).bar;
        html += '<div class="spark-bar" style="height:'+h+'%;background:'+mc+'"></div>';
      });
      html += '</div><div class="spark-labels">';
      last6.forEach(function(m){ html += '<div class="spark-lbl">'+m.month.slice(5)+'</div>'; });
      html += '</div></div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // ── 7. 8-Year Historical Revenue ─────────────────────────
  html += '<div class="section-head" style="margin-top:32px"><h2>8-Year Revenue History (2018–2026)</h2><p>Annual revenue India (excl. GST, incl. GST pre-2022). 2020 = COVID impact. 2026 = YTD May.</p></div>';
  html += '<div class="card"><div class="hist-wrap"><canvas id="hist-chart"></canvas></div></div>';

  // ── 8. YoY Comparison panel ──────────────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>Year-on-Year Comparison — FY 2026–27 vs FY 2025–26</h2><p>Same period comparison · '+fmtUnit()+' excl. GST</p></div>';
  html += '<div class="lb-wrap"><table class="lb-table"><thead><tr>';
  html += '<th>Counsellor</th><th>Centre</th><th>FY 2026–27 ('+pl+')</th><th>FY 2025–26 (PY)</th><th>Growth</th><th>vs PY %</th></tr></thead><tbody>';
  cs.forEach(function(c) {
    var g = c.growthPct;
    var gCol = g!==null?(g>=0?'#059669':'#dc2626'):'var(--muted)';
    var pySc = c.vsPY ? statusColor(c.vsPY) : null;
    html += '<tr>';
    html += '<td style="font-weight:700">'+esc(c.name)+'</td>';
    html += '<td style="color:var(--muted);font-size:12px">'+esc(c.centre)+'</td>';
    html += '<td class="num" style="font-weight:800;color:var(--navy)">'+fmtAmt(c.achLakh)+'</td>';
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.pyLakh)+'</td>';
    html += '<td style="font-weight:700;color:'+gCol+'">'+(g!==null?(g>=0?'▲ ':'▼ ')+Math.abs(g)+'%':'—')+'</td>';
    html += '<td>'+(pySc?'<span class="pill '+pySc.pill+'">'+c.vsPY+'%</span>':'<span style="color:var(--muted)">—</span>')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // ── MIS Reference Panel ──────────────────────────────────
  html += '<div class="section-head" style="margin-top:28px"><h2>MIS Reference — India Revenue</h2><p>Extracted from official monthly MIS slide decks · USD (000) · India geography only (excl. international centres)</p></div>';
  html += '<div class="lb-wrap"><table class="lb-table"><thead><tr>';
  html += '<th>Month</th><th>India Rev</th><th>Monthly BP</th><th>vs BP</th><th>vs PY</th><th>India as % of Edu Total</th><th>Education Total</th><th>YTD India</th><th>YTD vs BP</th></tr></thead><tbody>';
  MIS_INDIA.forEach(function(r) {
    var sc2 = statusColor(r.achPct);
    var vsc = r.vspy >= 0 ? 'pill-green' : 'pill-red';
    var indiaPct = Math.round(r.indiaUSD/r.totalEduUSD*100);
    var ytdAch = r.ytdIndia && r.ytdBP ? Math.round(r.ytdIndia/r.ytdBP*100) : null;
    var ytdSc = ytdAch ? statusColor(ytdAch) : null;
    // Convert to display unit
    var indiaDisp = gCurrency==='usd' ? r.indiaUSD+'' : Math.round(r.indiaUSD*84/10)/10+'L';
    var bpDisp    = gCurrency==='usd' ? r.bpUSD+'' : Math.round(r.bpUSD*84/10)/10+'L';
    var totDisp   = gCurrency==='usd' ? r.totalEduUSD+'' : Math.round(r.totalEduUSD*84/10)/10+'L';
    var ytdDisp   = r.ytdIndia ? (gCurrency==='usd' ? r.ytdIndia+'' : Math.round(r.ytdIndia*84/10)/10+'L') : '—';
    html += '<tr>';
    html += '<td style="font-weight:700">'+r.month+'<span style="font-size:10px;color:var(--muted);margin-left:4px">FY'+r.fy.slice(-5)+'</span></td>';
    html += '<td class="num" style="font-weight:800">'+indiaDisp+'</td>';
    html += '<td class="num" style="color:var(--muted)">'+bpDisp+'</td>';
    html += '<td><span class="pill '+sc2.pill+'">'+r.achPct+'%</span></td>';
    html += '<td><span class="pill '+(r.vspy>=0?'pill-green':'pill-red')+'">'+(r.vspy>=0?'▲':'▼')+Math.abs(r.vspy)+'%</span></td>';
    html += '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:'+indiaPct+'%;height:100%;background:var(--gold);border-radius:4px"></div></div><span style="font-size:11px;font-weight:700">'+indiaPct+'%</span></div></td>';
    html += '<td class="num" style="color:var(--muted)">'+totDisp+'</td>';
    html += '<td class="num">'+(r.ytdIndia?ytdDisp:'—')+'</td>';
    html += '<td>'+(ytdSc?'<span class="pill '+ytdSc.pill+'">'+ytdAch+'%</span>':'<span style="color:var(--muted)">—</span>')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  // Summary strip
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">';
  html += kpi('🇮🇳','India FY25 Full Year','512 USD(k)','= ₹43.0 Cr · Jan–Dec 2025');
  html += kpi('📊','India Monthly BP','47 USD(k)','= ₹39.5L · per month','amber');
  html += kpi('🌍','India as % of Edu','~21% avg','of total global Education revenue');
  html += '</div>';

  // ── Footer ───────────────────────────────────────────────
  html += '<div style="margin-top:32px;padding:12px 16px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:8px;font-size:11px;color:var(--muted)">';
  html += '📌 <strong>Period: '+pl+' · FY 2026–27</strong> · BP = Business Plan · PY = Prior Year · Revenue excl. GST · Live from Supabase';
  html += '</div>';

  document.getElementById('main-content').innerHTML = html;

  // Draw 8-year chart after DOM insert
  requestAnimationFrame(drawHistChart);
}

// ── Historical chart ──────────────────────────────────────
function drawHistChart() {
  var ctx = document.getElementById('hist-chart');
  if (!ctx) return;
  if (gHistChart) { gHistChart.destroy(); gHistChart = null; }

  var years = [2018,2019,2020,2021,2022,2023,2024,2025,2026];
  var totals = years.map(function(y) {
    var months = HIST_REVENUE[y] || [];
    return months.reduce(function(s,v){ return s + (v||0); }, 0);
  });
  // Convert to display unit
  var vals = totals.map(function(v) {
    var lakh = v / 100000;
    return gCurrency === 'usd' ? parseFloat((lakh * LAKH_TO_USD_K).toFixed(1)) : parseFloat(lakh.toFixed(1));
  });
  var labels = years.map(function(y){ return y===2020?'2020\n(COVID)':y===2026?'2026\n(YTD)':String(y); });
  var colors = years.map(function(y){
    if (y===2020) return 'rgba(220,38,38,0.5)';
    if (y===2026) return 'rgba(201,168,76,0.8)';
    return 'rgba(13,27,46,0.75)';
  });
  var borderColors = years.map(function(y){
    if (y===2020) return '#dc2626';
    if (y===2026) return '#C9A84C';
    return '#0D1B2E';
  });
  gHistChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label: gCurrency==='usd' ? 'Revenue USD ($000)' : 'Revenue ₹ Lakhs',
        data:vals, backgroundColor:colors, borderColor:borderColors,
        borderWidth:1.5, borderRadius:4
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){
          return gCurrency==='usd' ? ctx.parsed.y+' (000)' : '₹'+ctx.parsed.y+'L';
        }}}
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#7A7060',font:{family:'Plus Jakarta Sans',size:11}}},
        y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#7A7060',font:{size:11},callback:function(v){return gCurrency==='usd' ? v+'k' : '₹'+v+'L';}}}
      }
    }
  });
}

// ── KPI card builder ──────────────────────────────────────
function kpi(icon, label, value, sub, col) {
  return '<div class="kpi-card'+(col?' '+col:'')+'"><div class="kpi-icon">'+icon+'</div><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+esc(sub)+'</div></div>';
}
</script>
