<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGI SOG — HR Performance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="assets/shared.js"></script>
  <style>
    :root {
      --navy:   #0D1B2E;
      --gold:   #C9A84C;
      --gold-lt:#F5ECD0;
      --white:  #FFFFFF;
      --off:    #F8F6F1;
      --border: #E8E3D8;
      --muted:  #7A7060;
      --green:  #059669;
      --amber:  #B45309;
      --red:    #DC2626;
      --green-bg:#F0FDF4;
      --amber-bg:#FFFBEB;
      --red-bg:  #FFF5F5;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--off); color: var(--navy); font-size: 13px; }
    a { color: inherit; text-decoration: none; }

    /* ── Login ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a5c 100%);
    }
    .login-box {
      background: var(--white); border-radius: 16px; padding: 40px 36px;
      width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-logo img { height: 40px; filter: invert(1) brightness(0) saturate(0) invert(0.15); }
    .login-logo-text { font-size: 13px; font-weight: 800; color: var(--navy); line-height: 1.2; }
    .login-logo-sub { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    .login-title { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .login-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--navy); background: var(--off); transition: border-color .15s; }
    .field input:focus { outline: none; border-color: var(--gold); }
    .field { margin-bottom: 14px; }
    .login-btn { width: 100%; padding: 11px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background .15s; }
    .login-btn:hover { background: #1a3a5c; }
    .login-err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

    /* ── App shell ── */
    #app { display: none; }
    .topbar {
      background: var(--navy); color: var(--white); padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; }
    .topbar-brand img { height: 28px; filter: brightness(0) invert(1) opacity(.85); }
    .topbar-title { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: .02em; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .topbar-user { font-size: 12px; color: rgba(255,255,255,.6); }
    .topbar-badge { font-size: 10px; font-weight: 700; background: var(--gold); color: var(--navy); padding: 2px 8px; border-radius: 999px; letter-spacing: .06em; text-transform: uppercase; }
    .btn-ghost { background: transparent; border: 1.5px solid rgba(255,255,255,.25); color: rgba(255,255,255,.75); padding: 5px 12px; border-radius: 6px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

    /* Controls bar */
    .controls-bar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .ctrl-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .ctrl-select { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 12px; color: var(--navy); background: var(--off); }
    .ctrl-btn { padding: 6px 14px; border: 1.5px solid var(--gold); border-radius: 6px; background: transparent; color: var(--navy); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .ctrl-btn:hover { background: var(--gold-lt); }
    .ctrl-btn.primary { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .ctrl-btn.primary:hover { background: #1a3a5c; }
    .mode-btn { padding: 7px 14px; border: none; border-right: 1.5px solid var(--border); background: var(--off); color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { background: var(--gold-lt); color: var(--navy); }
    .mode-btn.active { background: var(--navy); color: var(--gold); }

    /* Main layout */
    .main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }

    /* Section headers */
    .section-head { margin: 28px 0 14px; }
    .section-head h2 { font-size: 16px; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
    .section-head p { font-size: 12px; color: var(--muted); }

    /* Cards */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card + .card { margin-top: 16px; }

    /* Hero strip */
    .hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .hero-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 16px; text-align: center; position: relative; overflow: hidden;
    }
    .hero-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); }
    .hero-icon { font-size: 24px; margin-bottom: 8px; }
    .hero-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    .hero-value { font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1; margin-bottom: 4px; }
    .hero-sub { font-size: 11px; color: var(--muted); }

    /* Leaderboard table */
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th { background: var(--navy); color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; text-align: left; }
    .lb-table th:last-child, .lb-table td:last-child { text-align: center; }
    .lb-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr:hover td { background: var(--off); }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 11px; font-weight: 800; }
    .rank-1 { background: #FFD700; color: #7a5c00; }
    .rank-2 { background: #C0C0C0; color: #4a4a4a; }
    .rank-3 { background: #CD7F32; color: #fff; }
    .rank-n { background: var(--border); color: var(--muted); }

    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot-green { background: var(--green); }
    .dot-amber { background: #F59E0B; }
    .dot-red   { background: var(--red); }

    .pct-pill {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
    }
    .pill-green { background: var(--green-bg); color: var(--green); }
    .pill-amber { background: var(--amber-bg); color: var(--amber); }
    .pill-red   { background: var(--red-bg); color: var(--red); }
    .pill-grey  { background: var(--border); color: var(--muted); }

    .trend-arrow { font-size: 14px; }

    /* Counsellor scorecard grid */
    .scorecard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .scorecard {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; position: relative; overflow: hidden;
    }
    .scorecard.green { border-top: 3px solid var(--green); }
    .scorecard.amber { border-top: 3px solid #F59E0B; }
    .scorecard.red   { border-top: 3px solid var(--red); }
    .sc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .sc-name { font-size: 14px; font-weight: 800; color: var(--navy); }
    .sc-centre { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sc-ring { position: relative; width: 70px; height: 70px; flex-shrink: 0; }
    .sc-ring svg { transform: rotate(-90deg); }
    .sc-ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--navy); font-family: 'JetBrains Mono', monospace; }
    .sc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .sc-meta-item label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 2px; }
    .sc-meta-item strong { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    /* Mini sparkline bars */
    .spark { display: flex; align-items: flex-end; gap: 3px; height: 36px; margin-top: 8px; }
    .spark-bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; transition: height .3s; }
    .spark-bar.green { background: var(--green); }
    .spark-bar.amber { background: #F59E0B; }
    .spark-bar.red   { background: var(--red); }
    .spark-bar.empty { background: var(--border); }
    .spark-labels { display: flex; gap: 3px; margin-top: 2px; }
    .spark-label { flex: 1; text-align: center; font-size: 8px; color: var(--muted); }

    /* Horizontal comparison bar chart */
    .hbar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .hbar-row:last-child { border-bottom: none; }
    .hbar-name { width: 130px; font-size: 12px; font-weight: 600; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hbar-track { flex: 1; height: 18px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
    .hbar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
    .hbar-pct { width: 52px; text-align: right; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

    /* Centre dials */
    .centre-dial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .centre-dial {
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 12px; text-align: center;
    }
    .centre-dial.green { border-top: 3px solid var(--green); }
    .centre-dial.amber { border-top: 3px solid #F59E0B; }
    .centre-dial.red   { border-top: 3px solid var(--red); }
    .cd-name { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .cd-pct { font-size: 28px; font-weight: 800; font-family: 'JetBrains Mono', monospace; line-height: 1; }
    .cd-pct.green { color: var(--green); }
    .cd-pct.amber { color: var(--amber); }
    .cd-pct.red   { color: var(--red); }
    .cd-label { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .cd-rank { font-size: 10px; font-weight: 700; color: var(--muted); margin-top: 6px; }

    /* Instructor rating cards */
    .instr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .instr-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    }
    .instr-name { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
    .instr-centre { font-size: 10px; color: var(--muted); margin-bottom: 10px; }
    .star-row { display: flex; gap: 3px; margin-bottom: 6px; }
    .star { font-size: 16px; }
    .instr-avg { font-size: 24px; font-weight: 800; color: var(--navy); font-family: 'JetBrains Mono', monospace; }
    .instr-sessions { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Loading / empty */
    .loading-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Print mode */
    @media print {
      .topbar, .controls-bar, #login-screen { display: none !important; }
      body { background: white; }
      .main { padding: 0; max-width: 100%; }
      .hero-card, .scorecard, .centre-dial, .instr-card { break-inside: avoid; }
      .section-head { break-before: auto; }
    }

    /* National KPI banner */
    .national-banner {
      background: linear-gradient(135deg, #0D1B2E 0%, #162c48 100%);
      border-radius: 14px; padding: 24px 28px; color: #fff; margin-bottom: 20px;
      position: relative; overflow: hidden;
    }
    .national-banner::after {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(201,168,76,.07);
    }
    .nb-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .nb-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: rgba(255,255,255,.5); }
    .nb-months { font-size: 11px; color: rgba(255,255,255,.4); }
    .nb-figures { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .nb-achieved { font-size: 42px; font-weight: 800; font-family: 'JetBrains Mono',monospace; color: #fff; line-height: 1; }
    .nb-of { font-size: 15px; color: rgba(255,255,255,.5); }
    .nb-target { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono',monospace; color: rgba(255,255,255,.7); }
    .nb-pct { font-size: 32px; font-weight: 800; font-family: 'JetBrains Mono',monospace; margin-left: auto; align-self: center; }
    .nb-track { background: rgba(255,255,255,.12); border-radius: 99px; height: 8px; margin-bottom: 14px; overflow: hidden; }
    .nb-fill { height: 100%; border-radius: 99px; transition: width .8s ease; }
    .nb-stats { display: flex; gap: 28px; flex-wrap: wrap; }
    .nb-stat { font-size: 12px; color: rgba(255,255,255,.55); }
    .nb-stat strong { color: rgba(255,255,255,.9); }

    /* KPI card strip */
    .kpi-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
    .kpi-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; position: relative; overflow: hidden;
    }
    .kpi-card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
    .kpi-card.green::after { background: var(--green); }
    .kpi-card.red::after   { background: var(--red); }
    .kpi-card.amber::after { background: #F59E0B; }
    .kpi-icon { font-size: 20px; margin-bottom: 8px; }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
    .kpi-value { font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1.1; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* Leaderboard */
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th { background: var(--navy); color: rgba(255,255,255,.65); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; text-align: left; font-weight: 700; }
    .lb-table th:first-child { border-radius: 8px 0 0 0; }
    .lb-table th:last-child  { border-radius: 0 8px 0 0; text-align: center; }
    .lb-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr:hover td { background: rgba(201,168,76,.04); }
    .lb-table .num { font-family: 'JetBrains Mono',monospace; font-size: 12px; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 800; }
    .rank-1 { background: linear-gradient(135deg,#FFD700,#f5c000); color: #5a3e00; box-shadow: 0 2px 8px rgba(255,215,0,.4); }
    .rank-2 { background: linear-gradient(135deg,#C0C0C0,#a8a8a8); color: #3a3a3a; }
    .rank-3 { background: linear-gradient(135deg,#CD7F32,#b06020); color: #fff; }
    .rank-n { background: var(--border); color: var(--muted); }

    .pct-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; font-family: 'JetBrains Mono',monospace; }
    .pill-green { background: #dcfce7; color: #059669; }
    .pill-amber { background: #fef3c7; color: #92400e; }
    .pill-red   { background: #fee2e2; color: #b91c1c; }
    .pill-grey  { background: var(--border); color: var(--muted); }

    /* Revenue bar chart */
    .rbar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .rbar-row:last-child { border-bottom: none; }
    .rbar-name { width: 120px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .rbar-centre { font-size: 10px; color: var(--muted); font-weight: 400; }
    .rbar-chart { flex: 1; position: relative; height: 22px; }
    .rbar-track { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 12px; background: var(--border); border-radius: 6px; }
    .rbar-fill  { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 12px; border-radius: 6px; transition: width .6s ease; }
    .rbar-nums  { width: 190px; flex-shrink: 0; display: flex; gap: 6px; align-items: baseline; justify-content: flex-end; }
    .rbar-ach   { font-size: 13px; font-weight: 800; font-family: 'JetBrains Mono',monospace; color: var(--navy); }
    .rbar-tgt   { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono',monospace; }
    .rbar-pct   { width: 56px; flex-shrink: 0; }

    /* Scorecard grid */
    .scorecard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .scorecard {
      background: var(--white); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    .sc-top { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .sc-name { font-size: 15px; font-weight: 800; color: var(--navy); }
    .sc-centre { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sc-rank-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--off); color: var(--muted); border: 1px solid var(--border); flex-shrink: 0; }
    .sc-ring { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
    .sc-ring svg { transform: rotate(-90deg); }
    .sc-ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--navy); font-family: 'JetBrains Mono',monospace; }
    .sc-rev { display: flex; align-items: baseline; gap: 6px; padding: 10px 16px; background: var(--off); border-bottom: 1px solid var(--border); }
    .sc-rev-ach { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono',monospace; color: var(--navy); }
    .sc-rev-label { font-size: 11px; color: var(--muted); }
    .sc-rev-tgt { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono',monospace; margin-left: auto; }
    .sc-body { padding: 12px 16px; }
    .sc-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .sc-meta-item label { font-size: 9px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 2px; }
    .sc-meta-item strong { font-size: 13px; font-weight: 800; font-family: 'JetBrains Mono',monospace; }
    .sc-trend { font-size: 11px; font-weight: 600; }
    /* Sparklines */
    .spark { display: flex; align-items: flex-end; gap: 3px; height: 32px; }
    .spark-bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
    .spark-bar.green { background: var(--green); }
    .spark-bar.amber { background: #F59E0B; }
    .spark-bar.red   { background: var(--red); }
    .spark-bar.empty { background: var(--border); }
    .spark-labels { display: flex; gap: 3px; margin-top: 2px; }
    .spark-label { flex: 1; text-align: center; font-size: 8px; color: var(--muted); }

    /* Centre cards */
    .centre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .centre-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; position: relative; overflow: hidden;
    }
    .centre-card.green { border-top: 3px solid var(--green); }
    .centre-card.amber { border-top: 3px solid #F59E0B; }
    .centre-card.red   { border-top: 3px solid var(--red); }
    .cc-name { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .cc-pct  { font-size: 30px; font-weight: 800; font-family: 'JetBrains Mono',monospace; line-height: 1; }
    .cc-rev  { font-size: 13px; font-family: 'JetBrains Mono',monospace; font-weight: 700; color: var(--navy); margin: 6px 0 2px; }
    .cc-tgt  { font-size: 11px; color: var(--muted); }
    .cc-bar  { height: 4px; background: var(--border); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .cc-bar-fill { height: 100%; border-radius: 99px; }

    /* Loading / spinner */
    .loading-state { text-align: center; padding: 60px 40px; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Print */
    @media print {
      .topbar, .controls-bar { display: none !important; }
      body { background: white; }
      .main { padding: 0; max-width: 100%; }
    }
    @media (max-width: 900px) {
      .kpi-strip { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 600px) {
      .kpi-strip { grid-template-columns: 1fr 1fr; }
      .main { padding: 16px 12px 40px; }
      .rbar-nums { display: none; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ─────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/igi-school-of-gemology-white-logo.png" alt="IGI">
      <div>
        <div class="login-logo-text">IGI SOG Performance Portal</div>
        <div class="login-logo-sub">HR Access — Read Only</div>
      </div>
    </div>
    <div class="login-title">HR Sign In</div>
    <div class="login-sub">Performance data, rankings &amp; centre health — read only.</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="hr-name" placeholder="HR" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="hr-pin" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────────────────────────────────── -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <img src="assets/igi-school-of-gemology-white-logo.png" alt="IGI">
      <div class="topbar-title">IGI SOG &mdash; HR Performance Portal</div>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge">HR View</span>
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn-ghost" onclick="window.print()">🖨 Print / PDF</button>
      <button class="btn-ghost" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="controls-bar">
    <span class="ctrl-label">View</span>
    <div style="display:flex;gap:0;border:1.5px solid var(--border);border-radius:7px;overflow:hidden">
      <button id="btn-fy"         class="mode-btn active" onclick="setMode('fy')">📅 FY 2026–27</button>
      <button id="btn-appraisal"  class="mode-btn"        onclick="setMode('appraisal')">📋 Appraisal Ref (Jan–Mar 2026)</button>
      <button id="btn-15m"        class="mode-btn"        onclick="setMode('15m')">📆 15-Month Combined</button>
    </div>
    <button class="ctrl-btn primary" onclick="loadData()" style="margin-left:12px">🔄 Refresh</button>
  </div>

  <div class="main">
    <div id="main-content">
      <div class="loading-state"><span class="spinner"></span>Loading performance data…</div>
    </div>
  </div>
</div>

<script>
// ── Auth state ────────────────────────────────────────────────────────────────
var hrName = '', hrPin = '', hrViewMode = 'fy';

function doLogin() {
  var nameEl = document.getElementById('hr-name');
  var pinEl  = document.getElementById('hr-pin');
  var errEl  = document.getElementById('login-err');
  var name   = (nameEl.value || '').trim();
  var pin    = (pinEl.value || '').trim();
  if (!name || !pin) { errEl.textContent = 'Enter username and password.'; return; }
  errEl.textContent = 'Signing in…';
  gasGet({ action: 'counselorLogin', name: name, pin: pin, pass: pin }, function(err, d) {
    if (err || !d || d.status !== 'ok') { errEl.textContent = 'Incorrect credentials. Please try again.'; return; }
    if (!d.isHR && d.authRole !== 'HR' && !d.isAdmin) { errEl.textContent = 'This portal is for HR access only.'; return; }
    hrName = name; hrPin = pin;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('topbar-user').textContent = name;
    loadData();
  });
}

function doLogout() {
  hrName = ''; hrPin = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('hr-pin').value = '';
  document.getElementById('login-err').textContent = '';
}

function setMode(mode) {
  hrViewMode = mode;
  ['fy','appraisal','15m'].forEach(function(m) {
    document.getElementById('btn-' + m).classList.toggle('active', m === mode);
  });
  loadData();
}

// ── Load data ─────────────────────────────────────────────────────────────────
function loadData() {
  var content = document.getElementById('main-content');
  content.innerHTML = '<div class="loading-state"><span class="spinner"></span>Loading performance data…</div>';
  gasGet({ action: 'getHRDashboard', hrName: hrName, hrPin: hrPin,
           name: hrName, pass: hrPin, viewMode: hrViewMode },
  function(err, d) {
    if (err || !d || d.status !== 'ok') {
      content.innerHTML = '<div class="loading-state" style="color:var(--red)">Failed to load data. Please try refreshing.</div>';
      return;
    }
    renderDashboard(d);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function lakh(v) { return '₹' + (Math.round((v||0)*10)/10).toFixed(1) + 'L'; }

// ── Render ─────────────────────────────────────────────────────────────────────
function renderDashboard(d) {
  var vm = d.viewMode || 'fy';
  var isFY = (vm === 'fy');
  var n = d.national || {};
  var counsellors = d.counsellors || [];
  var centres = d.centres || [];
  var instructors = d.instructors || [];
  var html = '';

  var modeLabel = isFY ? 'FY 2026–27 (Apr–Mar)' : (vm === 'appraisal' ? 'Appraisal Ref — Jan–Mar 2026' : '15-Month Combined (Jan 2026 – Mar 2027)');

  // ── 1. National KPI banner ────────────────────────────────────────────────
  if (isFY) {
    var achCr  = n.achievedCr  || 0;
    var tgtCr  = n.targetCr    || 5.5;
    var projCr = n.projectedCr;
    var gapCr  = n.gapCr != null ? n.gapCr : null;
    var pctFill = Math.min(Math.round(achCr / tgtCr * 100), 100);
    var natPct  = n.ytdPct || pctFill;
    var months  = n.monthsWithData || 0;
    var fillCol = natPct >= 90 ? '#10b981' : (natPct >= 70 ? '#f59e0b' : '#ef4444');
    html += '<div class="national-banner">';
    html += '<div class="nb-header"><span class="nb-label">National Revenue — FY 2026–27</span><span class="nb-months">' + months + ' month' + (months!==1?'s':'') + ' of data (Apr–Jun 2026)</span></div>';
    html += '<div class="nb-figures">';
    html += '<span class="nb-achieved">₹' + achCr.toFixed(2) + ' Cr</span>';
    html += '<span class="nb-of">achieved of</span>';
    html += '<span class="nb-target">₹' + tgtCr.toFixed(1) + ' Cr</span>';
    html += '<span class="nb-pct" style="color:' + fillCol + '">' + natPct + '%</span>';
    html += '</div>';
    html += '<div class="nb-track"><div class="nb-fill" style="width:' + pctFill + '%;background:' + fillCol + '"></div></div>';
    html += '<div class="nb-stats">';
    if (gapCr !== null) html += '<span class="nb-stat">🎯 Gap to target: <strong style="color:#fca5a5">₹' + gapCr.toFixed(2) + ' Cr</strong></span>';
    if (projCr)         html += '<span class="nb-stat">📈 Run-rate projection: <strong>₹' + projCr.toFixed(2) + ' Cr</strong> by Mar 2027</span>';
    html += '<span class="nb-stat">🏅 Top earner: <strong>' + esc(n.topPerformer ? n.topPerformer.name : '—') + '</strong></span>';
    html += '<span class="nb-stat">🏫 Best centre: <strong>' + esc(n.bestCentre ? n.bestCentre.centre : '—') + '</strong></span>';
    html += '</div>';
    html += '</div>';

    // KPI strip
    html += '<div class="kpi-strip">';
    var kpiCol = natPct >= 90 ? 'green' : (natPct >= 70 ? 'amber' : 'red');
    html += kpiCard('🎯', 'National Target Hit', natPct + '%', 'YTD vs ₹5.5 Cr', kpiCol);
    var tp = n.topPerformer;
    html += kpiCard('🥇', 'Top Earner', tp ? esc(tp.name) : '—', tp ? lakh(tp.ytdLakh) + ' achieved' : 'No data');
    html += kpiCard('📈', 'Most Improved', esc(n.mostImproved || '—'), 'Biggest positive revenue trend');
    var bc = n.bestCentre;
    html += kpiCard('🏫', 'Best Centre', bc ? esc(bc.centre) : '—', bc ? bc.ytdPct + '% of target' : 'No data');
    html += '</div>';

  } else {
    html += '<div style="padding:14px 18px;background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:16px">';
    html += '<div style="font-size:22px">📋</div>';
    html += '<div><div style="font-size:15px;font-weight:800;color:var(--navy)">' + esc(modeLabel) + '</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + (vm==='appraisal'?'Jan–Mar 2026 transition quarter — used for FY 2026–27 appraisal decisions':'All 15 months Jan 2026 – Mar 2027 — total revenue view') + '</div></div>';
    html += '<div style="margin-left:auto;text-align:right">';
    html += '<div style="font-size:22px;font-weight:800;font-family:JetBrains Mono,monospace;color:var(--navy)">' + counsellors.length + ' counsellors</div>';
    html += '<div style="font-size:11px;color:var(--muted)">with revenue data</div></div>';
    html += '</div>';
    html += '<div class="kpi-strip" style="grid-template-columns:repeat(3,1fr)">';
    html += kpiCard('🥇', 'Top Earner', counsellors[0]?esc(counsellors[0].name):'—', counsellors[0]?lakh(counsellors[0].ytdLakh):'No data');
    html += kpiCard('🏫', 'Top Centre', centres[0]?esc(centres[0].centre):'—', centres[0]?lakh(centres[0].ytdLakh):'No data');
    html += kpiCard('📈', 'Most Improved', esc(n.mostImproved||'—'), 'Biggest revenue growth');
    html += '</div>';
  }

  // ── 2. Revenue bar chart (visual first, table below) ─────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>📊 ' + (isFY ? 'Revenue vs Annual Target' : 'Revenue Ranking') + '</h2>';
  html += '<p>' + (isFY ? 'Track = individual annual target (proportional). Fill = revenue achieved. All figures excl. GST.' : 'Bars relative to top earner = 100%. Revenue excl. GST.') + '</p></div>';
  html += '<div class="card">';
  counsellors.forEach(function(c) {
    var bc = c.status==='green' ? '#059669' : (c.status==='amber' ? '#f59e0b' : (c.status==='red' ? '#dc2626' : '#0D1B2E'));
    var pc = c.status==='green' ? 'pill-green' : (c.status==='amber' ? 'pill-amber' : (c.status==='red' ? 'pill-red' : 'pill-grey'));
    var ytdIdx = c.ytdIndex||0, tgtIdx = c.targetIndex||100;
    var trackW = isFY ? tgtIdx : 100;
    var fillPct = isFY ? (tgtIdx>0 ? Math.min(Math.round(ytdIdx/tgtIdx*100),100) : 0) : ytdIdx;
    var fillW = Math.round(trackW * fillPct / 100);
    var ytdL = (c.ytdLakh||0).toFixed(1);
    var tgtL = isFY ? (c.targetLakh||0).toFixed(1) : null;
    var rc = c.rank===1?'rank-1':c.rank===2?'rank-2':c.rank===3?'rank-3':'rank-n';
    html += '<div class="rbar-row">';
    html += '<div><div class="rbar-name"><span class="rank-badge ' + rc + '" style="margin-right:6px">' + c.rank + '</span>' + esc(c.name) + '</div>';
    html += '<div class="rbar-centre" style="padding-left:32px">' + esc(c.centre||'—') + '</div></div>';
    html += '<div class="rbar-chart">';
    html += '<div class="rbar-track" style="width:' + Math.max(trackW,4) + '%;height:14px"></div>';
    html += '<div class="rbar-fill"  style="width:' + Math.max(fillW,0) + '%;height:14px;background:' + bc + '"></div>';
    html += '</div>';
    html += '<div class="rbar-nums">';
    html += '<span class="rbar-ach">₹' + ytdL + 'L</span>';
    if (isFY) html += '<span class="rbar-tgt">/ ₹' + tgtL + 'L</span>';
    html += '</div>';
    html += '<div class="rbar-pct"><span class="pct-pill ' + pc + '">' + (isFY ? c.ytdPct : ytdIdx) + '%</span></div>';
    html += '</div>';
  });
  html += '</div>';

  // ── 3. Leaderboard table ──────────────────────────────────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>🏆 Counsellor Leaderboard — ' + esc(modeLabel) + '</h2>';
  html += '<p>Sorted highest earner first. Revenue in Lakhs (₹L), excl. GST.</p></div>';
  html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="lb-table"><thead><tr>';
  html += '<th style="width:48px">Rank</th><th>Counsellor</th><th>Centre</th>';
  html += '<th>Revenue Achieved</th>';
  if (isFY) { html += '<th>Annual Target</th><th>YTD Hit %</th><th>QTD Hit %</th>'; }
  html += '<th style="text-align:center">Trend</th></tr></thead><tbody>';
  counsellors.forEach(function(c) {
    var pc = c.status==='green'?'pill-green':c.status==='amber'?'pill-amber':c.status==='red'?'pill-red':'pill-grey';
    var ti = c.trend==='up'?'⬆ Up':c.trend==='down'?'⬇ Down':'→ Flat';
    var tc = c.trend==='up'?'#059669':c.trend==='down'?'#dc2626':'var(--muted)';
    var rc = c.rank===1?'rank-1':c.rank===2?'rank-2':c.rank===3?'rank-3':'rank-n';
    html += '<tr>';
    html += '<td style="text-align:center"><span class="rank-badge ' + rc + '">' + c.rank + '</span></td>';
    html += '<td style="font-weight:700">' + esc(c.name) + '</td>';
    html += '<td style="color:var(--muted);font-size:12px">' + esc(c.centre||'—') + '</td>';
    html += '<td class="num" style="font-weight:800;color:var(--navy)">₹' + (c.ytdLakh||0).toFixed(1) + 'L</td>';
    if (isFY) {
      html += '<td class="num" style="color:var(--muted)">₹' + (c.targetLakh||0).toFixed(1) + 'L</td>';
      html += '<td><span class="pct-pill ' + pc + '">' + c.ytdPct + '%</span></td>';
      var qpc = c.qtdPct>=90?'pill-green':c.qtdPct>=70?'pill-amber':'pill-red';
      html += '<td><span class="pct-pill ' + qpc + '">' + c.qtdPct + '%</span></td>';
    }
    html += '<td style="text-align:center;font-size:11px;font-weight:700;color:' + tc + '">' + ti + '</td>';
    html += '</tr>';
  });
  if (!counsellors.length) html += '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">No data for this period.</td></tr>';
  html += '</tbody></table></div></div>';

  // ── 4. Individual Scorecards ──────────────────────────────────────────────
  html += '<div class="section-head" style="margin-top:28px"><h2>🗂 Individual Scorecards</h2><p>Revenue vs target with monthly performance trend</p></div>';
  html += '<div class="scorecard-grid">';
  counsellors.forEach(function(c) {
    var rc = c.status==='green'?'#059669':c.status==='amber'?'#f59e0b':c.status==='red'?'#dc2626':'#0D1B2E';
    var rb = c.status==='green'?'#dcfce7':c.status==='amber'?'#fef3c7':c.status==='red'?'#fee2e2':'#e8e3d8';
    var pct = isFY ? Math.min(c.ytdPct,100) : (c.ytdIndex||0);
    var circ = 2*Math.PI*26;
    var offs = circ*(1-pct/100);
    var ti = c.trend==='up'?'⬆ Improving':c.trend==='down'?'⬇ Declining':'→ Stable';
    var tc = c.trend==='up'?'#059669':c.trend==='down'?'#dc2626':'var(--muted)';
    var last6 = c.last6||[];
    var maxB = Math.max.apply(null,last6.map(function(m){return m.pct;}).concat([1]));
    var pc = c.status==='green'?'pill-green':c.status==='amber'?'pill-amber':c.status==='red'?'pill-red':'pill-grey';

    html += '<div class="scorecard">';
    // header
    html += '<div class="sc-top">';
    html += '<div class="sc-header">';
    html += '<div><div class="sc-name">' + esc(c.name) + '</div><div class="sc-centre">📍 ' + esc(c.centre||'—') + '</div></div>';
    html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
    html += '<span class="sc-rank-badge">Rank #' + c.rank + '</span>';
    html += '<div class="sc-ring" style="width:68px;height:68px"><svg width="68" height="68" viewBox="0 0 68 68" style="transform:rotate(-90deg)">';
    html += '<circle cx="34" cy="34" r="26" fill="none" stroke="' + rb + '" stroke-width="7"/>';
    html += '<circle cx="34" cy="34" r="26" fill="none" stroke="' + rc + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + offs.toFixed(1) + '"/>';
    html += '</svg><div class="sc-ring-pct" style="font-size:11px">' + pct + '%</div></div>';
    html += '</div></div>';
    html += '</div>';
    // Revenue row
    html += '<div class="sc-rev">';
    html += '<span class="sc-rev-ach">₹' + (c.ytdLakh||0).toFixed(1) + 'L</span>';
    html += '<span class="sc-rev-label">achieved</span>';
    if (isFY) html += '<span class="sc-rev-tgt">Target: ₹' + (c.targetLakh||0).toFixed(1) + 'L</span>';
    html += '</div>';
    // meta
    html += '<div class="sc-body">';
    html += '<div class="sc-meta">';
    if (isFY) {
      html += '<div class="sc-meta-item"><label>YTD %</label><strong><span class="pct-pill ' + pc + '" style="font-size:12px">' + c.ytdPct + '%</span></strong></div>';
      html += '<div class="sc-meta-item"><label>QTD %</label><strong>' + c.qtdPct + '%</strong></div>';
    } else {
      html += '<div class="sc-meta-item"><label>Rank</label><strong>#' + c.rank + '</strong></div>';
      html += '<div class="sc-meta-item"><label>vs Top</label><strong>' + (c.ytdIndex||0) + '%</strong></div>';
    }
    html += '<div class="sc-meta-item"><label>Trend</label><strong class="sc-trend" style="color:' + tc + '">' + ti + '</strong></div>';
    html += '</div>';
    if (last6.length) {
      html += '<div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Monthly trend</div>';
      html += '<div class="spark">';
      last6.forEach(function(m) {
        var h = maxB>0?Math.max(Math.round(m.pct/maxB*100),4):4;
        var cl = !m.hasData?'empty':m.pct>=90?'green':m.pct>=70?'amber':'red';
        html += '<div class="spark-bar ' + cl + '" style="height:' + h + '%"></div>';
      });
      html += '</div><div class="spark-labels">';
      last6.forEach(function(m){ html += '<div class="spark-label">' + m.month.slice(5) + '</div>'; });
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // ── 5. Centre Performance ─────────────────────────────────────────────────
  html += '<div class="section-head" style="margin-top:28px"><h2>🏫 Centre Performance' + (isFY?' — vs FY Target':'') + '</h2></div>';
  html += '<div class="centre-grid">';
  centres.forEach(function(c) {
    var cls = c.status==='green'?'green':c.status==='amber'?'amber':c.status==='red'?'red':'';
    var pc = c.status==='green'?'#059669':c.status==='amber'?'#f59e0b':c.status==='red'?'#dc2626':'var(--navy)';
    var fp = isFY ? Math.min(c.ytdPct,100) : (c.rank ? Math.max(100-((c.rank-1)*12),4) : 50);
    var bc = c.status==='green'?'#059669':c.status==='amber'?'#f59e0b':c.status==='red'?'#dc2626':'var(--navy)';
    html += '<div class="centre-card ' + cls + '">';
    html += '<div class="cc-name">' + esc(c.centre) + '</div>';
    html += '<div class="cc-pct" style="color:' + pc + '">' + (isFY?c.ytdPct+'%':'#'+c.rank) + '</div>';
    html += '<div class="cc-rev">₹' + (c.ytdLakh||0).toFixed(1) + 'L</div>';
    if (isFY) html += '<div class="cc-tgt">of ₹' + (c.targetLakh||0).toFixed(1) + 'L target</div>';
    else       html += '<div class="cc-tgt">Rank #' + c.rank + ' by revenue</div>';
    html += '<div class="cc-bar"><div class="cc-bar-fill" style="width:' + fp + '%;background:' + bc + '"></div></div>';
    html += '</div>';
  });
  if (!centres.length) html += '<div style="color:var(--muted);font-size:12px;padding:8px">No centre data.</div>';
  html += '</div>';

  // ── 6. Footer ─────────────────────────────────────────────────────────────
  html += '<div style="margin-top:32px;padding:12px 16px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:8px;font-size:11px;color:var(--muted)">';
  html += '📌 <strong>' + (isFY?'FY 2026–27 (Apr 2026 – Mar 2027)':vm==='appraisal'?'Appraisal Reference: Jan–Mar 2026':'Combined Jan 2026 – Mar 2027') + '</strong>';
  html += ' · Revenue in Lakhs (₹L) excl. GST · Live from IGI Supabase';
  html += '</div>';

  document.getElementById('main-content').innerHTML = html;
}

function kpiCard(icon, label, value, sub, col) {
  return '<div class="kpi-card' + (col?' '+col:'') + '"><div class="kpi-icon">' + icon + '</div><div class="kpi-label">' + label + '</div><div class="kpi-value">' + value + '</div><div class="kpi-sub">' + sub + '</div></div>';
}

</script>
