<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGI SOG — Performance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="assets/shared.js"></script>
  <style>
    :root {
      --navy:#0D1B2E; --gold:#C9A84C; --gold-lt:#F5ECD0;
      --white:#fff; --off:#F8F6F1; --border:#E8E3D8; --muted:#7A7060;
      --green:#059669; --lime:#84cc16; --amber:#d97706; --red:#dc2626; --gold-hit:#b45309;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--off);color:var(--navy);font-size:13px;}

    /* ── Login ─────────────────────────────────────── */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D1B2E 0%,#1a3a5c 100%);}
    .login-box{background:#fff;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
    .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .login-logo img{height:38px;filter:invert(1) brightness(0) invert(0.12);}
    .login-logo-text{font-size:13px;font-weight:800;color:var(--navy);line-height:1.2;}
    .login-logo-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
    .login-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px;}
    .login-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
    .field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--navy);background:var(--off);}
    .field input:focus{outline:none;border-color:var(--gold);}
    .login-btn{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
    .login-btn:hover{background:#1a3a5c;}
    .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}

    /* ── App shell ──────────────────────────────────── */
    #app{display:none;}
    .topbar{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
    .topbar-brand{display:flex;align-items:center;gap:10px;}
    .topbar-brand img{height:26px;filter:brightness(0) invert(1) opacity(.85);}
    .topbar-title{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.02em;}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .topbar-badge{font-size:10px;font-weight:700;background:var(--gold);color:var(--navy);padding:2px 8px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;}

    /* ── Controls bar ──────────────────────────────── */
    .controls-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:0;flex-wrap:wrap;min-height:48px;}
    .ctrl-group{display:flex;align-items:center;gap:0;border-right:1px solid var(--border);padding:8px 16px 8px 0;margin-right:16px;}
    .ctrl-group:last-child{border-right:none;margin-left:auto;}
    .ctrl-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-right:8px;white-space:nowrap;}
    /* Period filter buttons */
    .pf-btn{padding:5px 11px;border:1.5px solid var(--border);border-radius:6px;background:var(--off);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-right:4px;transition:all .15s;}
    .pf-btn:hover{border-color:var(--gold);color:var(--navy);}
    .pf-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy);}
    /* Toggle switches */
    .toggle-group{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;}
    .tg-btn{padding:5px 12px;border:none;background:var(--off);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border-right:1px solid var(--border);}
    .tg-btn:last-child{border-right:none;}
    .tg-btn:hover{background:var(--gold-lt);color:var(--navy);}
    .tg-btn.active{background:var(--navy);color:var(--gold);}
    /* Currency pill */
    .cur-pill{display:flex;background:var(--off);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;}
    .cur-opt{padding:4px 12px;font-size:11px;font-weight:700;color:var(--muted);transition:all .15s;}
    .cur-opt.active{background:var(--navy);color:var(--gold);border-radius:18px;}

    /* ── Main layout ───────────────────────────────── */
    .main{max-width:1260px;margin:0 auto;padding:20px 24px 60px;}
    .section-head{margin:24px 0 12px;}
    .section-head h2{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:2px;}
    .section-head p{font-size:11px;color:var(--muted);}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}

    /* ── National dark banner ──────────────────────── */
    .nat-banner{background:linear-gradient(135deg,#0D1B2E 0%,#18304e 100%);border-radius:14px;padding:22px 28px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;}
    .nat-banner::before{content:'';position:absolute;top:-50px;right:-50px;width:220px;height:220px;border-radius:50%;background:rgba(201,168,76,.06);}
    .nb-row1{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
    .nb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45);}
    .nb-period-tag{font-size:10px;font-weight:700;background:rgba(201,168,76,.2);color:var(--gold);padding:3px 9px;border-radius:999px;letter-spacing:.06em;}
    .nb-figures{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .nb-big{font-size:40px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;line-height:1;}
    .nb-of{font-size:14px;color:rgba(255,255,255,.45);margin:0 4px;}
    .nb-bp{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.65);}
    .nb-pct-big{font-size:32px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-left:auto;align-self:center;padding-left:16px;}
    .nb-track{background:rgba(255,255,255,.1);border-radius:99px;height:7px;margin-bottom:14px;overflow:hidden;}
    .nb-fill{height:100%;border-radius:99px;transition:width .8s ease;}
    .nb-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
    .nb-col label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);display:block;margin-bottom:3px;}
    .nb-col .val{font-size:15px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;}
    .nb-col .sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px;}
    .nb-col .up{color:#4ade80;} .nb-col .dn{color:#f87171;}

    /* ── KPI strip ─────────────────────────────────── */
    .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
    .kpi-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 16px;position:relative;overflow:hidden;}
    .kpi-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
    .kpi-card.green::after{background:var(--green);}
    .kpi-card.amber::after{background:var(--amber);}
    .kpi-card.red::after{background:var(--red);}
    .kpi-icon{font-size:18px;margin-bottom:6px;}
    .kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px;}
    .kpi-value{font-size:20px;font-weight:800;color:var(--navy);line-height:1.1;}
    .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px;}

    /* ── Leaderboard table ──────────────────────────── */
    .lb-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
    .lb-table{width:100%;border-collapse:collapse;min-width:700px;}
    .lb-table th{background:var(--navy);color:rgba(255,255,255,.6);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;font-weight:700;white-space:nowrap;}
    .lb-table th:first-child{border-radius:0;}
    .lb-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
    .lb-table tr:last-child td{border-bottom:none;}
    .lb-table tr:hover td{background:rgba(201,168,76,.03);}
    .lb-table .num{font-family:'JetBrains Mono',monospace;font-size:12px;}
    .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;}
    .rank-1{background:linear-gradient(135deg,#FFD700,#f5c000);color:#5a3e00;box-shadow:0 2px 6px rgba(255,215,0,.4);}
    .rank-2{background:linear-gradient(135deg,#C0C0C0,#a8a8a8);color:#3a3a3a;}
    .rank-3{background:linear-gradient(135deg,#CD7F32,#b06020);color:#fff;}
    .rank-n{background:var(--border);color:var(--muted);}
    .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
    .pill-gold {background:#fef3c7;color:#92400e;}
    .pill-green{background:#dcfce7;color:#059669;}
    .pill-lime {background:#f0fdf4;color:#65a30d;}
    .pill-amber{background:#fff7ed;color:#c2410c;}
    .pill-red  {background:#fee2e2;color:#b91c1c;}
    .pill-grey {background:var(--border);color:var(--muted);}
    /* Dynamic bar in leaderboard */
    .bar-cell{display:flex;align-items:center;gap:8px;min-width:160px;}
    .bar-track{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;position:relative;}
    .bar-bp{position:absolute;left:0;top:0;height:100%;background:rgba(201,168,76,.25);border-radius:5px;}
    .bar-ach{position:absolute;left:0;top:0;height:100%;border-radius:5px;}
    .bar-val{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--navy);white-space:nowrap;}

    /* ── Revenue chart section ──────────────────────── */
    .rbar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .rbar-row:last-child{border-bottom:none;}
    .rbar-name{width:130px;font-size:12px;font-weight:700;flex-shrink:0;}
    .rbar-sub{font-size:9px;color:var(--muted);font-weight:400;}
    .rbar-chart{flex:1;position:relative;height:18px;}
    .rbar-track{position:absolute;left:0;top:50%;transform:translateY(-50%);height:10px;background:var(--border);border-radius:5px;}
    .rbar-bp-mark{position:absolute;top:50%;transform:translateY(-50%);width:2px;height:16px;background:rgba(201,168,76,.6);border-radius:1px;}
    .rbar-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:10px;border-radius:5px;transition:width .7s ease;}
    .rbar-nums{display:flex;align-items:baseline;gap:5px;flex-shrink:0;min-width:140px;justify-content:flex-end;}
    .rbar-ach{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);}
    .rbar-bp{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
    .rbar-pct{flex-shrink:0;width:58px;text-align:right;}

    /* ── Scorecards ─────────────────────────────────── */
    .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
    .sc-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .sc-top{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
    .sc-hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
    .sc-name{font-size:14px;font-weight:800;color:var(--navy);}
    .sc-loc{font-size:10px;color:var(--muted);margin-top:2px;}
    .sc-ring{position:relative;width:64px;height:64px;flex-shrink:0;}
    .sc-ring svg{transform:rotate(-90deg);}
    .sc-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--navy);font-family:'JetBrains Mono',monospace;}
    .sc-rev-row{display:flex;align-items:baseline;gap:6px;padding:8px 16px;background:var(--off);border-bottom:1px solid var(--border);}
    .sc-rev-ach{font-size:21px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);}
    .sc-rev-label{font-size:10px;color:var(--muted);}
    .sc-rev-bp{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-left:auto;}
    .sc-body{padding:10px 16px 12px;}
    .sc-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
    .sc-mi label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:2px;}
    .sc-mi strong{font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;}
    .spark{display:flex;align-items:flex-end;gap:3px;height:28px;}
    .spark-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;}
    .spark-labels{display:flex;gap:3px;margin-top:2px;}
    .spark-lbl{flex:1;text-align:center;font-size:7px;color:var(--muted);}

    /* ── Centre leaderboard ──────────────────────────── */
    .centre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
    .cc-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;}
    .cc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
    .cc-card.gold::before{background:var(--gold);}
    .cc-card.green::before{background:var(--green);}
    .cc-card.lime::before{background:var(--lime);}
    .cc-card.amber::before{background:var(--amber);}
    .cc-card.red::before{background:var(--red);}
    .cc-name{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:10px;padding-left:10px;}
    .cc-pct{font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;padding-left:10px;}
    .cc-rev{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--navy);margin:6px 0 2px;padding-left:10px;}
    .cc-bp{font-size:10px;color:var(--muted);padding-left:10px;}
    .cc-py{font-size:10px;font-weight:700;padding-left:10px;margin-top:4px;}
    .cc-bar{height:4px;background:var(--border);border-radius:99px;margin-top:10px;overflow:hidden;}
    .cc-bar-fill{height:100%;border-radius:99px;}

    /* ── 8-year historical chart ─────────────────────── */
    .hist-wrap{position:relative;height:280px;}

    /* ── Responsive ──────────────────────────────────── */
    @media(max-width:900px){
      .kpi-strip{grid-template-columns:repeat(2,1fr);}
      .nb-cols{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:600px){
      .main{padding:12px 12px 40px;}
      .kpi-strip{grid-template-columns:1fr 1fr;}
      .nb-figures{gap:6px;}
      .nb-big{font-size:28px;}
    }
    @media print{
      .topbar,.controls-bar{display:none!important;}
      body{background:#fff;}
      .main{padding:0;max-width:100%;}
    }
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/igi-school-of-gemology-white-logo.png" onerror="this.style.display='none'" style="height:34px;filter:invert(1) brightness(0)">
      <div>
        <div class="login-logo-text">IGI SOG</div>
        <div class="login-logo-sub">Performance Portal</div>
      </div>
    </div>
    <div class="login-title">Sign in</div>
    <div class="login-sub">HR access · Performance & Revenue</div>
    <div class="field"><label>Name</label><input id="hr-name" placeholder="HR" autocomplete="off"></div>
    <div class="field"><label>PIN</label><input id="hr-pin" type="password" placeholder="••••••••" autocomplete="off"></div>
    <button class="login-btn" onclick="doLogin()">Access Portal</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────── -->
<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-brand">
      <img src="assets/igi-school-of-gemology-white-logo.png" onerror="this.style.display='none'" style="height:32px">
      <span class="topbar-title">IGI SOG Performance Portal</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge">CONFIDENTIAL</span>
      <span id="topbar-user" style="font-size:12px;color:rgba(255,255,255,.5)"></span>
      <button style="background:transparent;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);padding:4px 10px;border-radius:5px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <!-- Controls bar -->
  <div class="controls-bar">
    <!-- Period filter -->
    <div class="ctrl-group">
      <span class="ctrl-label">Period</span>
      <button class="pf-btn" data-p="mtd"  onclick="setPeriod(this)">MTD</button>
      <button class="pf-btn active" data-p="ytd"  onclick="setPeriod(this)">YTD</button>
      <button class="pf-btn" data-p="q1"   onclick="setPeriod(this)">Q1</button>
      <button class="pf-btn" data-p="q2"   onclick="setPeriod(this)">Q2</button>
      <button class="pf-btn" data-p="q3"   onclick="setPeriod(this)">Q3</button>
      <button class="pf-btn" data-p="q4"   onclick="setPeriod(this)">Q4</button>
      <button class="pf-btn" data-p="h1"   onclick="setPeriod(this)">H1</button>
      <button class="pf-btn" data-p="h2"   onclick="setPeriod(this)">H2</button>
      <button class="pf-btn" data-p="fy"   onclick="setPeriod(this)">Full FY</button>
    </div>
    <!-- Compare toggle -->
    <div class="ctrl-group">
      <span class="ctrl-label">Compare</span>
      <div class="toggle-group">
        <button class="tg-btn active" id="cmp-bp" onclick="setCompare('bp')">vs BP</button>
        <button class="tg-btn"        id="cmp-py" onclick="setCompare('py')">vs PY</button>
      </div>
    </div>
    <!-- Currency toggle -->
    <div class="ctrl-group" style="margin-left:auto;border-right:none;">
      <span class="ctrl-label">Currency</span>
      <div class="cur-pill" onclick="toggleCurrency()">
        <span class="cur-opt active" id="cur-inr">₹ L</span>
        <span class="cur-opt"        id="cur-usd">$ (000)</span>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">
    <div id="main-content">
      <div style="text-align:center;padding:60px;color:var(--muted)">
        <div style="display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px"></div>
        <div>Loading dashboard…</div>
      </div>
    </div>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<script>
// ── Constants ────────────────────────────────────────────
var USD_RATE = 84;       // 1 USD = ₹84
// 1 Lakh = 100000 INR → USD = 100000/84 = 1190.5 → displayed as "1.2" in USD(000)
var LAKH_TO_USD_K = 100000 / USD_RATE / 1000; // ≈ 1.190

var HIST_REVENUE = {
  2018:[3405336,941593,3116043,2609209,4535315,2994895,6373675,5196103,3274120,727163,3650639,860787],
  2019:[3045350,4713079,3492773,3529289,2758191,2202327,4364942,2283990,2518980,887720,2998288,2185025],
  2020:[2667858,3477765,1508990,null,null,728240,1529138,1788898,1378510,1656113,771658,1949520],
  2021:[3311366,2926181,5212955,832831,535937,535572,2298597,2328684,3749010,1937500,3661956,856790],
  2022:[3305724,2682778,3960663,3665607,6884315,1452658,8735324,2789338,6163965,164134,6289081,2401987],
  2023:[3380142,6599301,3016249,6526248,5864731,4694395,10926122,2307975,8511142,1918002,3166099,3040456],
  2024:[6893621,2590758,6802273,4082340,5735371,5053157,5597054,7110170,3364801,292876,3806046,3449708],
  2025:[4696341,4185220,6199914,3219910,6926117,3532757,8202971,2475524,5209557,646351,5851588,942985],
  2026:[8340782,7323308,3553858,6939770,7403275,null,null,null,null,null,null,null]
};

// ── State ────────────────────────────────────────────────
var gPeriod   = 'ytd';   // active period filter
var gCompare  = 'bp';    // 'bp' | 'py'
var gCurrency = 'inr';   // 'inr' | 'usd'
var gData     = null;    // last loaded dashboard data
var gHistChart = null;

// ── Auth ─────────────────────────────────────────────────
function doLogin() {
  var name = document.getElementById('hr-name').value.trim();
  var pin  = document.getElementById('hr-pin').value.trim();
  document.getElementById('login-err').textContent = '';
  gasGet({ action:'counselorLogin', name:name, pin:pin }, function(err, d) {
    if (err || !d || d.status !== 'ok' || !d.isHR) {
      document.getElementById('login-err').textContent = (d && d.reason) || 'Incorrect credentials — HR PIN required';
      return;
    }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('topbar-user').textContent = name;
    loadDashboard();
  });
}
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('hr-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
});
function doLogout() {
  location.reload();
}

// ── Period / Compare / Currency controls ─────────────────
function setPeriod(btn) {
  document.querySelectorAll('.pf-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  gPeriod = btn.getAttribute('data-p');
  loadDashboard();
}
function setCompare(mode) {
  gCompare = mode;
  document.getElementById('cmp-bp').classList.toggle('active', mode==='bp');
  document.getElementById('cmp-py').classList.toggle('active', mode==='py');
  if (gData) renderDashboard(gData); // re-render with same data, different compare column
}
function toggleCurrency() {
  gCurrency = gCurrency === 'inr' ? 'usd' : 'inr';
  document.getElementById('cur-inr').classList.toggle('active', gCurrency==='inr');
  document.getElementById('cur-usd').classList.toggle('active', gCurrency==='usd');
  if (gData) renderDashboard(gData);
}

// ── Format helpers ────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtAmt(lakh) {
  if (gCurrency === 'usd') {
    var k = lakh * LAKH_TO_USD_K;
    return k.toFixed(1);
  }
  return '₹' + lakh.toFixed(1) + 'L';
}
function fmtAmtCr(cr) {
  if (gCurrency === 'usd') {
    var k = cr * 100 * LAKH_TO_USD_K;
    return k.toFixed(0) + 'k';
  }
  return '₹' + cr.toFixed(2) + ' Cr';
}
function fmtUnit() { return gCurrency==='usd' ? 'USD ($000)' : '₹ Lakhs'; }
function growthTag(pct) {
  if (pct === null || pct === undefined) return '<span style="color:var(--muted);font-size:10px">—</span>';
  var col = pct >= 0 ? '#059669' : '#dc2626';
  var arrow = pct >= 0 ? '▲' : '▼';
  return '<span style="font-size:10px;font-weight:700;color:'+col+'">'+arrow+' '+Math.abs(pct)+'%</span>';
}

// Dynamic color for % achievement
function statusColor(pct) {
  if (pct >= 100) return { pill:'pill-gold',  bar:'#C9A84C', text:'#92400e' };
  if (pct >= 90)  return { pill:'pill-green', bar:'#059669', text:'#059669' };
  if (pct >= 75)  return { pill:'pill-lime',  bar:'#84cc16', text:'#65a30d' };
  if (pct >= 50)  return { pill:'pill-amber', bar:'#f59e0b', text:'#c2410c' };
  return              { pill:'pill-red',   bar:'#dc2626', text:'#b91c1c' };
}
function cardClass(status) {
  return { gold:'gold', green:'green', lime:'lime', amber:'amber', red:'red' }[status] || 'red';
}

// ── Load data from backend ────────────────────────────────
function loadDashboard() {
  document.getElementById('main-content').innerHTML =
    '<div style="text-align:center;padding:60px;color:var(--muted)"><div style="display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px"></div><div>Loading…</div></div>';
  gasGet({ action:'getHRDashboard', periodFilter:gPeriod }, function(err, d) {
    if (err || !d || d.status !== 'ok') {
      document.getElementById('main-content').innerHTML = '<div style="padding:40px;color:var(--red)">Error loading data. Please refresh.</div>';
      return;
    }
    gData = d;
    renderDashboard(d);
  });
}

// ── Render ────────────────────────────────────────────────
function renderDashboard(d) {
  var n   = d.national || {};
  var cs  = d.counsellors || [];
  var ctr = d.centres     || [];
  var pl  = esc(d.periodLabel || gPeriod.toUpperCase());
  var isBP  = (gCompare === 'bp');
  var html = '';

  // ── 1. National dark banner ─────────────────────────────
  var achCr   = n.achCr   || 0;
  var bpCr    = n.bpCr    || 0;
  var pyAchCr = n.pyAchCr || 0;
  var vsBP    = n.vsBP    || 0;
  var vsPY    = n.vsPY;
  var growth  = n.growthPct;
  var annVsBP = n.annVsBP || 0;
  var projCr  = n.projCr;
  var gapCr   = n.gapCr;
  var sc      = statusColor(isBP ? vsBP : (vsPY||0));
  var fillPct = Math.min(isBP ? vsBP : (vsPY||0), 150);
  var fillW   = Math.min(Math.round(fillPct/150*100),100);

  html += '<div class="nat-banner">';
  html += '<div class="nb-row1">';
  html += '<div><div class="nb-label">India — Education Revenue</div><div style="margin-top:4px;font-size:11px;color:rgba(255,255,255,.4)">vs '+(isBP?'Business Plan (BP)':'Prior Year (PY)')+'</div></div>';
  html += '<span class="nb-period-tag">'+pl+'</span>';
  html += '</div>';
  html += '<div class="nb-figures">';
  html += '<span class="nb-big">'+fmtAmtCr(achCr)+'</span>';
  if (isBP && bpCr) {
    html += '<span class="nb-of">vs BP</span><span class="nb-bp">'+fmtAmtCr(bpCr)+'</span>';
  } else if (!isBP && pyAchCr) {
    html += '<span class="nb-of">vs PY</span><span class="nb-bp">'+fmtAmtCr(pyAchCr)+'</span>';
  }
  var displayPct = isBP ? vsBP : (vsPY || 0);
  html += '<span class="nb-pct-big" style="color:'+sc.bar+'">'+displayPct+'%</span>';
  html += '</div>';
  html += '<div class="nb-track"><div class="nb-fill" style="width:'+fillW+'%;background:'+sc.bar+'"></div></div>';
  html += '<div class="nb-cols">';
  html += '<div class="nb-col"><label>Achieved</label><span class="val">'+fmtAmtCr(achCr)+'</span><span class="sub">'+pl+'</span></div>';
  if (isBP) {
    html += '<div class="nb-col"><label>Business Plan (BP)</label><span class="val">'+fmtAmtCr(bpCr)+'</span><span class="sub">Annual BP: '+fmtAmtCr(5.5)+'</span></div>';
    html += '<div class="nb-col"><label>vs Annual BP</label><span class="val" style="color:'+(annVsBP>=90?'#4ade80':'#fbbf24')+'">'+annVsBP+'%</span><span class="sub">'+fmtAmtCr(gapCr||0)+' gap</span></div>';
    if (projCr) html += '<div class="nb-col"><label>Run-rate Projection</label><span class="val">'+fmtAmtCr(projCr)+'</span><span class="sub">by Mar 2027</span></div>';
    else html += '<div class="nb-col"><label>Top Performer</label><span class="val" style="font-size:13px">'+esc(n.topPerformer?n.topPerformer.name:'—')+'</span><span class="sub">highest earner</span></div>';
  } else {
    html += '<div class="nb-col"><label>Prior Year (PY)</label><span class="val">'+fmtAmtCr(pyAchCr)+'</span><span class="sub">same period</span></div>';
    html += '<div class="nb-col"><label>Growth vs PY</label><span class="val '+(growth>=0?'up':'dn')+'">'+(growth!==null?(growth>=0?'▲':'▼')+Math.abs(growth||0)+'%':'—')+'</span><span class="sub">YoY change</span></div>';
    html += '<div class="nb-col"><label>Top Performer</label><span class="val" style="font-size:13px">'+esc(n.topPerformer?n.topPerformer.name:'—')+'</span><span class="sub">highest earner</span></div>';
  }
  html += '</div></div>';

  // ── 2. KPI strip ────────────────────────────────────────
  html += '<div class="kpi-strip">';
  html += kpi('🎯', isBP?'vs BP':'vs PY', displayPct+'%', pl+' achievement', cardClass(sc.pill==='pill-gold'?'gold':sc.pill==='pill-green'?'green':sc.pill==='pill-lime'?'lime':sc.pill==='pill-amber'?'amber':'red'));
  html += kpi('🥇', 'Top Earner', cs[0]?esc(cs[0].name):'—', cs[0]?fmtAmt(cs[0].achLakh)+' · '+cs[0].centre:'—');
  html += kpi('📈', 'Most Improved', esc(n.mostImproved||'—'), 'vs Prior Year');
  html += kpi('🏫', 'Best Centre', ctr[0]?esc(ctr[0].centre):'—', ctr[0]?fmtAmt(ctr[0].achLakh):'—');
  html += '</div>';

  // ── 3. Counsellor Leaderboard ───────────────────────────
  html += '<div class="section-head"><h2>🏆 Counsellor Performance — '+pl+'</h2><p>'+fmtUnit()+' excl. GST · '+(isBP?'vs Business Plan (BP)':'vs Prior Year (PY)')+'</p></div>';
  html += '<div class="lb-wrap"><table class="lb-table"><thead><tr>';
  html += '<th>Rank</th><th>Counsellor</th><th>Centre</th>';
  html += '<th>Revenue ('+fmtUnit()+')</th>';
  html += '<th>BP</th>';
  html += '<th>'+(isBP?'vs BP':'vs PY')+'</th>';
  html += '<th>Q1 vs BP</th>';
  if (!isBP) html += '<th>vs BP</th>';
  html += '<th>PY</th><th>Trend</th></tr></thead><tbody>';
  cs.forEach(function(c) {
    var rc = c.rank===1?'rank-1':c.rank===2?'rank-2':c.rank===3?'rank-3':'rank-n';
    var pct = isBP ? c.vsBP : (c.vsPY||0);
    var sc2 = statusColor(pct);
    var ti  = c.trend==='up'?'▲':c.trend==='down'?'▼':'→';
    var tc  = c.trend==='up'?'#059669':c.trend==='down'?'#dc2626':'var(--muted)';
    var bpW = Math.min(c.bpIdx||0, 100);
    var achW = Math.min(c.achIdx||0, 100);
    html += '<tr>';
    html += '<td style="text-align:center"><span class="rank-badge '+rc+'">'+c.rank+'</span></td>';
    html += '<td style="font-weight:700">'+esc(c.name)+'</td>';
    html += '<td style="color:var(--muted);font-size:12px">'+esc(c.centre)+'</td>';
    html += '<td><div class="bar-cell">';
    html += '<div class="bar-track" style="flex:1"><div class="bar-bp" style="width:'+bpW+'%"></div><div class="bar-ach" style="width:'+achW+'%;background:'+sc2.bar+'"></div></div>';
    html += '<span class="bar-val">'+fmtAmt(c.achLakh)+'</span></div></td>';
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.bpLakh)+'</td>';
    html += '<td><span class="pill '+sc2.pill+'">'+pct+'%</span></td>';
    var q1sc = statusColor(c.q1VsBP||0);
    html += '<td><span class="pill '+q1sc.pill+'">'+c.q1VsBP+'%</span></td>';
    if (!isBP) { var bpSc=statusColor(c.vsBP||0); html+='<td><span class="pill '+bpSc.pill+'">'+c.vsBP+'%</span></td>'; }
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.pyLakh)+'</td>';
    html += '<td style="text-align:center;font-weight:800;color:'+tc+'">'+ti+'</td>';
    html += '</tr>';
  });
  if (!cs.length) html += '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--muted)">No data for this period.</td></tr>';
  html += '</tbody></table></div>';

  // ── 4. Revenue bar chart ─────────────────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>📊 Revenue vs BP — '+pl+'</h2><p>Gold marker = Business Plan. Fill colour = achievement level. '+fmtUnit()+' excl. GST.</p></div>';
  html += '<div class="card">';
  var maxBP  = Math.max.apply(null, cs.map(function(c){return c.bpLakh||0;}).concat([0.1]));
  var maxAch = Math.max.apply(null, cs.map(function(c){return c.achLakh||0;}).concat([0.1]));
  var maxAll = Math.max(maxBP, maxAch);
  cs.forEach(function(c) {
    var pct  = isBP ? c.vsBP : (c.vsPY||0);
    var sc2  = statusColor(pct);
    var bpW  = Math.round((c.bpLakh||0)/maxAll*100);
    var achW = Math.round((c.achLakh||0)/maxAll*100);
    html += '<div class="rbar-row">';
    html += '<div><div class="rbar-name">'+esc(c.name)+'</div><div class="rbar-sub">'+esc(c.centre)+'</div></div>';
    html += '<div class="rbar-chart">';
    html += '<div class="rbar-track" style="width:100%;height:10px"></div>';
    html += '<div class="rbar-bp-mark" style="left:'+bpW+'%"></div>';
    html += '<div class="rbar-fill" style="width:'+achW+'%;background:'+sc2.bar+'"></div>';
    html += '</div>';
    html += '<div class="rbar-nums"><span class="rbar-ach">'+fmtAmt(c.achLakh)+'</span><span class="rbar-bp">BP:'+fmtAmt(c.bpLakh)+'</span></div>';
    html += '<div class="rbar-pct"><span class="pill '+sc2.pill+'">'+pct+'%</span></div>';
    html += '</div>';
  });
  html += '</div>';

  // ── 5. Centre Leaderboard ────────────────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>🏫 Centre Performance — '+pl+'</h2><p>Revenue vs BP and vs PY by centre. '+fmtUnit()+' excl. GST.</p></div>';
  html += '<div class="lb-wrap"><table class="lb-table"><thead><tr>';
  html += '<th>Rank</th><th>Centre</th><th>Revenue</th><th>BP</th><th>vs BP</th><th>PY</th><th>vs PY</th></tr></thead><tbody>';
  ctr.forEach(function(c) {
    var rc = c.rank===1?'rank-1':c.rank===2?'rank-2':c.rank===3?'rank-3':'rank-n';
    var sc2 = statusColor(c.vsBP||0);
    var pysc = statusColor(c.vsPY||0);
    var achW = c.achIdx||0;
    html += '<tr>';
    html += '<td style="text-align:center"><span class="rank-badge '+rc+'">'+c.rank+'</span></td>';
    html += '<td style="font-weight:800">'+esc(c.centre)+'</td>';
    html += '<td><div class="bar-cell"><div class="bar-track" style="flex:1"><div class="bar-ach" style="width:'+achW+'%;background:'+sc2.bar+'"></div></div><span class="bar-val">'+fmtAmt(c.achLakh)+'</span></div></td>';
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.bpLakh)+'</td>';
    html += '<td><span class="pill '+sc2.pill+'">'+c.vsBP+'%</span></td>';
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.pyLakh)+'</td>';
    var vpill = c.vsPY ? statusColor(c.vsPY) : null;
    html += '<td>'+(vpill?'<span class="pill '+vpill.pill+'">'+(c.vsPY||0)+'%</span>':'<span style="color:var(--muted)">—</span>')+'</td>';
    html += '</tr>';
  });
  if (!ctr.length) html += '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">No centre data.</td></tr>';
  html += '</tbody></table></div>';
  // Centre cards view
  html += '<div class="centre-grid" style="margin-top:14px">';
  ctr.forEach(function(c) {
    var sc2 = statusColor(c.vsBP||0);
    var cls = sc2.pill==='pill-gold'?'gold':sc2.pill==='pill-green'?'green':sc2.pill==='pill-lime'?'lime':sc2.pill==='pill-amber'?'amber':'red';
    html += '<div class="cc-card '+cls+'">';
    html += '<div class="cc-name">'+esc(c.centre)+'</div>';
    html += '<div class="cc-pct" style="color:'+sc2.bar+'">'+c.vsBP+'%</div>';
    html += '<div class="cc-rev">'+fmtAmt(c.achLakh)+'</div>';
    html += '<div class="cc-bp">BP: '+fmtAmt(c.bpLakh)+'</div>';
    if (c.pyLakh) {
      var g = c.growthPct;
      html += '<div class="cc-py" style="color:'+(g>=0?'#059669':'#dc2626')+'">'+(g!==null?(g>=0?'▲ ':'▼ ')+Math.abs(g)+'% vs PY':'')+'</div>';
    }
    html += '<div class="cc-bar"><div class="cc-bar-fill" style="width:'+(c.achIdx||0)+'%;background:'+sc2.bar+'"></div></div>';
    html += '</div>';
  });
  html += '</div>';

  // ── 6. Individual Scorecards ─────────────────────────────
  html += '<div class="section-head" style="margin-top:28px"><h2>🗂 Individual Scorecards</h2><p>Revenue, BP comparison, monthly trend</p></div>';
  html += '<div class="sc-grid">';
  cs.forEach(function(c) {
    var pct = isBP ? c.vsBP : (c.vsPY||0);
    var sc2 = statusColor(pct);
    var cls = sc2.pill==='pill-gold'?'gold':sc2.pill==='pill-green'?'green':sc2.pill==='pill-lime'?'lime':sc2.pill==='pill-amber'?'amber':'red';
    var circ = 2*Math.PI*24;
    var offs = circ*(1-Math.min(pct,100)/100);
    var ti = c.trend==='up'?'▲ Improving':c.trend==='down'?'▼ Declining':'→ Stable';
    var tc = c.trend==='up'?'#059669':c.trend==='down'?'#dc2626':'var(--muted)';
    var last6 = c.last6||[];
    var maxV  = Math.max.apply(null,last6.map(function(x){return x.pct;}).concat([1]));
    html += '<div class="sc-card" style="border-top:3px solid '+sc2.bar+'">';
    html += '<div class="sc-top"><div class="sc-hrow">';
    html += '<div><div class="sc-name">'+esc(c.name)+'</div><div class="sc-loc">📍'+esc(c.centre)+' · Rank #'+c.rank+'</div></div>';
    html += '<div class="sc-ring"><svg width="64" height="64" viewBox="0 0 64 64" style="transform:rotate(-90deg)">';
    html += '<circle cx="32" cy="32" r="24" fill="none" stroke="'+sc2.bar+'22" stroke-width="7"/>';
    html += '<circle cx="32" cy="32" r="24" fill="none" stroke="'+sc2.bar+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+offs.toFixed(1)+'"/>';
    html += '</svg><div class="sc-ring-pct">'+pct+'%</div></div>';
    html += '</div></div>';
    html += '<div class="sc-rev-row"><span class="sc-rev-ach">'+fmtAmt(c.achLakh)+'</span><span class="sc-rev-label">'+pl+'</span>';
    html += '<span class="sc-rev-bp">BP: '+fmtAmt(c.bpLakh)+'</span></div>';
    html += '<div class="sc-body"><div class="sc-meta">';
    var bpSc = statusColor(c.vsBP||0); var pySc = statusColor(c.vsPY||0);
    html += '<div class="sc-mi"><label>vs BP</label><strong><span class="pill '+bpSc.pill+'" style="font-size:11px">'+c.vsBP+'%</span></strong></div>';
    html += '<div class="sc-mi"><label>Q1 vs BP</label><strong>'+c.q1VsBP+'%</strong></div>';
    html += '<div class="sc-mi"><label>Trend</label><strong style="color:'+tc+';font-size:11px">'+ti+'</strong></div>';
    html += '<div class="sc-mi"><label>PY Revenue</label><strong>'+fmtAmt(c.pyLakh)+'</strong></div>';
    html += '<div class="sc-mi"><label>vs PY</label><strong>'+(c.vsPY!==null?'<span class="pill '+(c.vsPY>=100?'pill-green':'pill-amber')+'">'+c.vsPY+'%</span>':'—')+'</strong></div>';
    html += '<div class="sc-mi"><label>Annual BP</label><strong>'+fmtAmt(c.annBPLakh||0)+'</strong></div>';
    html += '</div>';
    if (last6.length) {
      html += '<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px">Monthly Trend (vs monthly BP)</div>';
      html += '<div class="spark">';
      last6.forEach(function(m) {
        var h  = maxV>0?Math.max(Math.round(m.pct/maxV*100),4):4;
        var mc = !m.hasData?'var(--border)':statusColor(m.pct).bar;
        html += '<div class="spark-bar" style="height:'+h+'%;background:'+mc+'"></div>';
      });
      html += '</div><div class="spark-labels">';
      last6.forEach(function(m){ html += '<div class="spark-lbl">'+m.month.slice(5)+'</div>'; });
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // ── 7. 8-Year Historical Revenue ─────────────────────────
  html += '<div class="section-head" style="margin-top:32px"><h2>📅 8-Year Revenue Story (2018–2026)</h2><p>Annual revenue India (excl. GST, incl. GST pre-2022). 2020 = COVID impact. 2026 = YTD May.</p></div>';
  html += '<div class="card"><div class="hist-wrap"><canvas id="hist-chart"></canvas></div></div>';

  // ── 8. YoY Comparison panel ──────────────────────────────
  html += '<div class="section-head" style="margin-top:24px"><h2>📊 Performance vs PY — FY 2026–27 vs FY 2025–26</h2><p>Same period comparison · '+fmtUnit()+' excl. GST</p></div>';
  html += '<div class="lb-wrap"><table class="lb-table"><thead><tr>';
  html += '<th>Counsellor</th><th>Centre</th><th>FY 2026–27 ('+pl+')</th><th>FY 2025–26 (PY)</th><th>Growth</th><th>vs PY %</th></tr></thead><tbody>';
  cs.forEach(function(c) {
    var g = c.growthPct;
    var gCol = g!==null?(g>=0?'#059669':'#dc2626'):'var(--muted)';
    var pySc = c.vsPY ? statusColor(c.vsPY) : null;
    html += '<tr>';
    html += '<td style="font-weight:700">'+esc(c.name)+'</td>';
    html += '<td style="color:var(--muted);font-size:12px">'+esc(c.centre)+'</td>';
    html += '<td class="num" style="font-weight:800;color:var(--navy)">'+fmtAmt(c.achLakh)+'</td>';
    html += '<td class="num" style="color:var(--muted)">'+fmtAmt(c.pyLakh)+'</td>';
    html += '<td style="font-weight:700;color:'+gCol+'">'+(g!==null?(g>=0?'▲ ':'▼ ')+Math.abs(g)+'%':'—')+'</td>';
    html += '<td>'+(pySc?'<span class="pill '+pySc.pill+'">'+c.vsPY+'%</span>':'<span style="color:var(--muted)">—</span>')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // ── Footer ───────────────────────────────────────────────
  html += '<div style="margin-top:32px;padding:12px 16px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:8px;font-size:11px;color:var(--muted)">';
  html += '📌 <strong>Period: '+pl+' · FY 2026–27</strong> · BP = Business Plan · PY = Prior Year · Revenue excl. GST · Live from Supabase';
  html += '</div>';

  document.getElementById('main-content').innerHTML = html;

  // Draw 8-year chart after DOM insert
  requestAnimationFrame(drawHistChart);
}

// ── Historical chart ──────────────────────────────────────
function drawHistChart() {
  var ctx = document.getElementById('hist-chart');
  if (!ctx) return;
  if (gHistChart) { gHistChart.destroy(); gHistChart = null; }

  var years = [2018,2019,2020,2021,2022,2023,2024,2025,2026];
  var totals = years.map(function(y) {
    var months = HIST_REVENUE[y] || [];
    return months.reduce(function(s,v){ return s + (v||0); }, 0);
  });
  // Convert to display unit
  var vals = totals.map(function(v) {
    var lakh = v / 100000;
    return gCurrency === 'usd' ? parseFloat((lakh * LAKH_TO_USD_K).toFixed(1)) : parseFloat(lakh.toFixed(1));
  });
  var labels = years.map(function(y){ return y===2020?'2020\n(COVID)':y===2026?'2026\n(YTD)':String(y); });
  var colors = years.map(function(y){
    if (y===2020) return 'rgba(220,38,38,0.5)';
    if (y===2026) return 'rgba(201,168,76,0.8)';
    return 'rgba(13,27,46,0.75)';
  });
  var borderColors = years.map(function(y){
    if (y===2020) return '#dc2626';
    if (y===2026) return '#C9A84C';
    return '#0D1B2E';
  });
  gHistChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label: gCurrency==='usd' ? 'Revenue USD ($000)' : 'Revenue ₹ Lakhs',
        data:vals, backgroundColor:colors, borderColor:borderColors,
        borderWidth:1.5, borderRadius:4
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){
          return gCurrency==='usd' ? ctx.parsed.y+' (000)' : '₹'+ctx.parsed.y+'L';
        }}}
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#7A7060',font:{family:'Plus Jakarta Sans',size:11}}},
        y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#7A7060',font:{size:11},callback:function(v){return gCurrency==='usd' ? v+'k' : '₹'+v+'L';}}}
      }
    }
  });
}

// ── KPI card builder ──────────────────────────────────────
function kpi(icon, label, value, sub, col) {
  return '<div class="kpi-card'+(col?' '+col:'')+'"><div class="kpi-icon">'+icon+'</div><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+esc(sub)+'</div></div>';
}
</script>
