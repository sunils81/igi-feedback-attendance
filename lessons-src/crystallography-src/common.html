<style>
.cxv{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#13284a 0%,#0a1630 55%,#060d1f 100%);border:1px solid rgba(160,200,255,.16);box-shadow:inset 0 0 80px rgba(0,0,0,.35)}

.cxv::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(140,190,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,190,255,.05) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.cx-lab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cxl{position:absolute;left:0;top:0;white-space:nowrap;font:700 17px/1 var(--body);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9)}

.cxl.ang{font:700 17px/1 var(--body);color:#ffd27a;background:rgba(6,12,28,.6);padding:3px 7px;border-radius:7px}

.cxseg button.on{background:#c9a24d;color:#111;border-color:#c9a24d}

.scene:not(.dark) .cxseg button.on{background:#16213a;color:#fff;border-color:#16213a}

.sysh{font:700 74px/1 var(--display);color:#FBF6EA}
.dk{font:500 20px/1.4 var(--body);color:#dbe5f7}
.dk b{color:#ffd27a;font-weight:700}
.kvd{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font:500 19px/1.35 var(--body);color:#dbe5f7}
.kvd>b{font:800 14px/1.6 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#c9a24d}
.myth{border:1px solid rgba(201,162,77,.45);border-radius:16px;padding:14px 18px;background:rgba(201,162,77,.07);cursor:pointer}
.myth .q{font:700 19px/1.3 var(--body);color:#fff}
.myth .a{font:500 18px/1.4 var(--body);color:#dbe5f7;margin-top:8px;display:none}
.myth.open .a{display:block}
.myth .tag{font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#c9a24d;margin-bottom:6px}

details.fnote[open] summary{background:#c9a24d;color:#111}
details.fnote .fb{clear:both;margin-top:52px;background:rgba(8,16,36,.96);border:1px solid rgba(201,162,77,.55);border-radius:16px;padding:18px 22px;font:500 19px/1.45 var(--body);color:#e6eefc;box-shadow:0 20px 60px rgba(0,0,0,.5)}
details.fnote .fb b{color:#ffd27a}
.scene:not(.dark) details.fnote .fb{background:#fff;color:#22304a;border-color:var(--line)}
.scene:not(.dark) details.fnote .fb b{color:#8a6a1f}
.ctable{width:100%;border-collapse:collapse;font:500 20px/1.3 var(--body);color:#e6eefc}
.ctable th{font:800 14px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#c9a24d;text-align:left;padding:12px 12px;border-bottom:1px solid rgba(201,162,77,.5)}
.ctable td{padding:12px 12px;border-bottom:1px solid rgba(160,200,255,.14);vertical-align:top}
.ctable td:first-child{font:700 22px/1.2 var(--display);color:#fff}
.ctable .r{font:700 20px/1.2 var(--display);color:#ffd27a}
</style>
<script>
/* deck helpers shared by both crystallography decks */
window.CXD = (function () {
  const C = window.CX, T = C.T, v3 = C.v3;
  document.addEventListener('click', e => { const m = e.target.closest('.myth'); if (m) { m.classList.toggle('open'); e.stopPropagation(); return } if (e.target.closest('details.fnote')) e.stopPropagation() }, true);
  function seg(el, items, onSel, start) {
    el.classList.add('cxseg'); el.innerHTML = '';
    items.forEach((it, i) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = it[1]; b.onclick = e => { e.stopPropagation(); sel(i) }; el.appendChild(b) });
    function sel(i) { [...el.children].forEach((b, k) => b.classList.toggle('on', k === i)); onSel(items[i][0], i) }
    sel(start || 0); return sel;
  }
  function deg(a, b) { return (a.angleTo(b) / C.D2R) }
  function describe(f, cdir) {
    const n = f.plane.n, ang = Math.round(deg(n, cdir || v3(0, 0, 1)));
    let rel = ang === 0 || ang === 180 ? 'at right angles to the c axis (it caps the crystal)' : ang === 90 ? 'parallel to the c axis (a side face)' : 'inclined to the c axis (its normal is ' + Math.min(ang, 180 - ang) + '° from c)';
    return '<b>Face ' + (f.plane.label || '') + '</b> · belongs to the form <b>' + (f.plane.form || '') + '</b><br>This face is ' + rel + '. All faces of one form are related by the crystal’s symmetry, so they are identical in an ideal crystal.';
  }
  function crystal(v, key, opt) {
    opt = opt || {}; const four = !!opt.four;
    const H = v.setCrystal(C.FORMS[key](), { color: opt.color, keepCam: opt.keepCam, formColors: opt.formColors });
    v.setAxes(C.crystalAxes(key, v.ext, four));
    const Bs = C.BASES[key](), mx = Math.max(...Bs.map(b => b.length())), k = v.ext * .55 / mx;
    v.setCell(Bs.map(b => b.clone().multiplyScalar(k)), { r: .012 * v.ext, pcolor: 0xffd27a });
    v.key = key; return H;
  }
  /* a full crystal-system slide */
  function system(sc, cfg) {
    const ce = sc.querySelector('[data-cx=crystal]'), ue = sc.querySelector('[data-cx=cell]');
    const info = document.createElement('div'); info.className = 'cx-info'; ce.appendChild(info);
    const hint = document.createElement('div'); hint.className = 'cx-hint'; hint.textContent = 'Drag to rotate · scroll to zoom · shift-drag to pan'; ce.appendChild(hint);
    const v = new C.Viewer(ce, { tools: ['views', 'auto', 'axes', 'labels', 'edges', 'wire', 'cell', 'inspect', 'reset'], color: cfg.color, opacity: cfg.opacity || .55, labels: false, fit: cfg.fit || 4.4 });
    v.onPick = f => { if (f) { info.innerHTML = describe(f, C.BASES[v.key]()[2].clone().normalize()); info.classList.add('show') } else info.classList.remove('show') };
    v.onToggle = (k, on) => { if (k === 'inspect') { if (on) { info.innerHTML = '<b>Inspect mode.</b> Click any face to identify it. Click it again, or press ◎ Inspect, to leave.'; info.classList.add('show'); hint.style.display = 'none' } else { info.classList.remove('show'); hint.style.display = '' } } };
    const fs = sc.querySelector('[data-cx=forms]'), fn = sc.querySelector('[data-cx=formnote]');
    seg(fs, cfg.forms, (key, i) => { crystal(v, key, { four: cfg.four, color: cfg.forms[i][3] || cfg.color }); if (fn) fn.innerHTML = cfg.forms[i][2] || '' }, 0);
    const u = new C.Viewer(ue, { color: cfg.color, cellAlways: true, fit: cfg.cellFit || 3.6, view: 'std', spin: .004 });
    const cells = cfg.cells || [[null, null, cfg.cell]];
    const drawCell = c => { u.setCell(c.bs(), { axes: true, angles: c.angles, names: c.names, fill: cfg.color, fitCam: true, lgroup: 'cellv' }); clearExtra(u); if (c.extra) c.extra(u) };
    const cs = sc.querySelector('[data-cx=cellseg]');
    if (cs && cells.length > 1) seg(cs, cells.map((c, i) => [i, c[1]]), (i) => drawCell(cells[i][2])); else drawCell(cells[0][2]);
    return { v, u };
  }
  function clearExtra(v) { while (v.extra.children.length) v.extra.remove(v.extra.children[0]) }
  function hexOutline(u, Bs, color) {
    // hexagonal prism made of three cells: draw its outline faintly around the primitive cell
    const [A, B, Cc] = Bs, O = A.clone().add(B).add(Cc).multiplyScalar(-.5);
    const m = new T.LineBasicMaterial({ color: color || 0x9fd0ff, transparent: true, opacity: .55 });
    const a = A.length();
    const H = [0, 1, 2, 3, 4, 5].map(k => { const ang = k * Math.PI / 3; return v3(Math.cos(ang) * a, Math.sin(ang) * a, 0) });
    [0, 1].forEach(t => { const z = Cc.clone().multiplyScalar(t); const pts = H.concat([H[0]]).map(p => p.clone().add(O).add(z)); u.extra.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), m)) });
    H.forEach(p => u.extra.add(new T.Line(new T.BufferGeometry().setFromPoints([p.clone().add(O), p.clone().add(O).add(Cc)]), m)));
    const sg = new T.SphereGeometry(a * .035, 12, 10), sm = new T.MeshStandardMaterial({ color: 0x9fd0ff });
    H.concat([v3()]).forEach(p => [0, 1].forEach(t => { const s = new T.Mesh(sg, sm); s.position.copy(p).add(O).add(Cc.clone().multiplyScalar(t)); u.extra.add(s) }));
  }
  function lattice(v, Bs, n, opt) {
    opt = opt || {}; const pts = []; const [A, B, Cc] = Bs; const h = (n - 1) / 2;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) pts.push(A.clone().multiplyScalar(i - h).add(B.clone().multiplyScalar(j - h)).add(Cc.clone().multiplyScalar(k - h)));
    const g = new T.SphereGeometry(opt.r || .06, 14, 10), m = new T.MeshStandardMaterial({ color: opt.color || 0x9fd0ff, roughness: .3, metalness: .2, transparent: true, opacity: opt.opacity || 1 });
    const im = new T.InstancedMesh(g, m, pts.length), M = new T.Matrix4(); pts.forEach((p, i) => { M.makeTranslation(p.x, p.y, p.z); im.setMatrixAt(i, M) });
    (opt.group || v.extra).add(im); return { im, pts, m };
  }
  /* add a polyhedron (from planes) to any group: faces + white edges */
  function solid(group, planes, color, opt) {
    opt = opt || {}; const H = C.hull(planes); const g = new T.Group(); let ext = 0; H.V.forEach(p => ext = Math.max(ext, p.length()));
    const fm = new T.MeshStandardMaterial({ color, transparent: true, opacity: opt.opacity != null ? opt.opacity : .55, roughness: .18, metalness: .08, side: T.DoubleSide, depthWrite: false, flatShading: true, emissive: new T.Color(color).multiplyScalar(.18) });
    H.F.forEach(f => { const pos = []; for (let k = 1; k < f.idx.length - 1; k++)[f.idx[0], f.idx[k], f.idx[k + 1]].forEach(j => pos.push(H.V[j].x, H.V[j].y, H.V[j].z)); const gg = new T.BufferGeometry(); gg.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); gg.computeVertexNormals(); g.add(new T.Mesh(gg, fm)) });
    const em = new T.MeshBasicMaterial({ color: opt.edge || 0xffffff, transparent: true, opacity: .9 }), seen = {}, rr = opt.r || ext * .012;
    H.F.forEach(f => f.idx.forEach((a, i) => { const b = f.idx[(i + 1) % f.idx.length], key = Math.min(a, b) + '-' + Math.max(a, b); if (seen[key]) return; seen[key] = 1; const p = H.V[a], q = H.V[b], d = v3().subVectors(q, p), L = d.length(); if (L < 1e-6) return; const cy = new T.Mesh(new T.CylinderGeometry(rr, rr, L, 8), em); cy.position.copy(p).add(q).multiplyScalar(.5); cy.quaternion.setFromUnitVectors(v3(0, 1, 0), d.normalize()); g.add(cy) }));
    if (opt.pos) g.position.copy(opt.pos); group.add(g); g.userData = { H, ext, fm }; return g;
  }
  return { seg, crystal, system, describe, hexOutline, lattice, clearExtra, solid };
})();
</script>
