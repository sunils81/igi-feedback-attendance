<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
@font-face{font-family:'Playfair Display';src:url('fonts/playfair-display-latin-normal.woff2') format('woff2');font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('fonts/playfair-display-latin-italic.woff2') format('woff2');font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:'Manrope';src:url('fonts/manrope-latin-500-normal.woff2') format('woff2');font-weight:400 500}
@font-face{font-family:'Manrope';src:url('fonts/manrope-latin-700-normal.woff2') format('woff2');font-weight:600 700}
@font-face{font-family:'Manrope';src:url('fonts/manrope-latin-800-normal.woff2') format('woff2');font-weight:800}
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono-latin-600-normal.woff2') format('woff2');font-weight:400 700}

/* IGI lesson deck — same look as the Diamond Masterclass: navy frame, warm ivory reading
   surface, champagne gold. Built for projection: one fixed 1920x1080 stage, large type. */
:root{
  --navy:#0A1530; --navy-2:#102043; --navy-3:#16295A;
  --ivory:#F5F1E8; --ivory-2:#EFE8D8;
  --gold:#B58A3E; --gold-hi:#E6C98F; --gold-deep:#7A5A16;
  --gold-grad:linear-gradient(180deg,#F0D9A6 0%,#D6B16C 48%,#B3873C 100%);
  --good:#1F7A4D; --bad:#B23A2B; --warn:#9A6A00;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.77,0,.18,1); --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#050b18;font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
img{-webkit-user-drag:none}
#viewport{position:fixed;inset:0;background:#050b18;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:var(--ivory)}

.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;
  --ink:#0D1733; --ink2:#2F3650; --muted:#5A6075; --card:#FFFFFF; --card-2:#FBF8F1; --line:#E2D9C4; --gold-t:#86621A; --chipbg:#FFFFFF;
  color:var(--ink);
  background:radial-gradient(1300px 760px at 88% 0%,#FFFDF8 0%,#F6F1E6 55%,#EEE6D4 100%)}
.scene.dark{--ink:#F7F1E4; --ink2:#D5DAE6; --muted:#A9B2C8; --card:rgba(255,255,255,.07); --card-2:rgba(255,255,255,.04); --line:rgba(214,177,108,.32); --gold-t:#E6C98F; --chipbg:rgba(255,255,255,.05);
  background:radial-gradient(1200px 800px at 75% 0%,#18295A 0%,#0C1736 50%,#060C1C 100%)}
.scene.active,.scene.leaving{visibility:visible}
.scene.active{z-index:2}.scene.leaving{z-index:1}
.scene.leaving::after{content:"";position:absolute;inset:0;background:#050b18;opacity:0;z-index:50;pointer-events:none}
.scene.moving{will-change:transform,clip-path;backface-visibility:hidden}
.pad{position:absolute;inset:132px 120px 96px 120px;display:flex;flex-direction:column;gap:30px}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.dark .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,28,.96) 0%,rgba(6,12,28,.82) 42%,rgba(6,12,28,.2) 100%)}
.scene.active .kb{animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.15) translate(-1.5%,-1%)}}
.facets{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
  linear-gradient(115deg,transparent 0 62%,rgba(181,138,62,.07) 62% 62.2%,transparent 62.2%),
  linear-gradient(65deg,transparent 0 78%,rgba(181,138,62,.07) 78% 78.2%,transparent 78.2%)}

.eyebrow{font:800 20px/1 var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-t);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:40px;height:2px;background:var(--gold-grad)}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
h1{font:600 124px/1.0 var(--display);letter-spacing:-.015em}
h2{font:600 64px/1.1 var(--display);letter-spacing:-.01em}
h3{font:800 30px/1.25 var(--body)}
p{margin:0}
.lead{font:500 32px/1.5 var(--body);color:var(--ink2);max-width:1200px}
.body{font:500 27px/1.55 var(--body);color:var(--ink2)}
.small{font:500 22px/1.5 var(--body);color:var(--ink2)}
.muted{color:var(--muted)}
.gold{color:var(--gold-t)} .it{font-family:var(--display);font-style:italic}
b,strong{font-weight:800}
.shine .w>i,.shine .c{background:linear-gradient(100deg,#B3873C 0%,#F0D9A6 35%,#fff 50%,#F0D9A6 65%,#B3873C 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.credit{position:absolute;right:30px;bottom:62px;font:500 15px/1.3 var(--body);color:var(--muted);text-align:right;max-width:1000px;z-index:3}

.kt .w,.kc .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .03em .14em;margin:-.08em -.03em -.14em}
.kt .w>i,.kc .c{display:inline-block;font-style:inherit;will-change:transform}
.kc .c{white-space:pre}

.row{display:flex;gap:30px}.col{display:flex;flex-direction:column;gap:20px}.grow{flex:1;min-width:0}
.center{align-items:center;justify-content:center;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 32px;box-shadow:0 14px 40px rgba(13,23,51,.07),0 1px 2px rgba(13,23,51,.05);color:var(--ink)}
.dark .card{box-shadow:none;background:rgba(255,255,255,.085)}
.card h3{margin-bottom:8px}
.card p{color:var(--ink2)}
.num-badge{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--gold-grad);color:#0A1530;font:800 21px/1 var(--body);flex:none;box-shadow:0 6px 16px rgba(181,138,62,.3)}
.chip{display:inline-flex;align-items:center;gap:10px;font:800 17px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border-radius:40px;border:1.5px solid var(--line);background:var(--chipbg);color:var(--ink2)}
.chip.gold{border-color:var(--gold);color:var(--gold-t)}
.chip.solid{background:var(--navy);color:#F5EFE3;border-color:var(--navy)}
.photo{position:relative;border-radius:22px;overflow:hidden;background:#0A1530;box-shadow:0 22px 60px rgba(13,23,51,.18);margin:0;min-height:0}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo.fit img{object-fit:contain}
.photo.white{background:#fff}.photo.white img{object-fit:contain}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 22px;font:700 20px/1.35 var(--body);color:#fff;background:linear-gradient(transparent,rgba(6,12,28,.88))}
.photo.zoom{cursor:zoom-in}
.photo.zoom::after{content:"⤢";position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--body);color:#0A1530;background:rgba(240,217,166,.9);opacity:0;transition:.3s}
.photo.zoom:hover::after{opacity:1}
.tip{border-left:5px solid var(--gold);padding:18px 26px;background:linear-gradient(90deg,rgba(181,138,62,.14),rgba(181,138,62,.02));border-radius:0 16px 16px 0;font:500 25px/1.5 var(--body);color:var(--ink)}
.tip b{color:var(--gold-t)}
.num{font:700 120px/1 var(--display);color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.btn{background:var(--gold-grad);color:#0A1530;border:0;border-radius:40px;padding:18px 34px;font:800 19px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px rgba(181,138,62,.32),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:transparent;color:var(--gold-t);border:1.5px solid var(--gold);box-shadow:none}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:800 20px/1 var(--body);padding:16px 18px;cursor:pointer;transition:.3s var(--out)}
.seg button:hover{border-color:var(--gold)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#F5EFE3;box-shadow:0 10px 24px rgba(10,21,48,.25)}
.dark .seg button.on{background:var(--gold-grad);color:#0A1530;border-color:transparent}

.step{transition:opacity .7s var(--out),transform .8s var(--out)}
.scene .step:not(.on){opacity:0;transform:translateY(34px) scale(.98);pointer-events:none}
.step.on.flash{animation:flash 1.2s var(--out)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(181,138,62,.55)}100%{box-shadow:0 0 0 22px rgba(181,138,62,0)}}
#hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:22;font:800 15px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:#0A1530;background:var(--gold-grad);padding:12px 20px;border-radius:30px;box-shadow:0 8px 24px rgba(181,138,62,.35);opacity:0;transition:opacity .4s;pointer-events:none;display:flex;gap:10px;align-items:center}
#hint.show{opacity:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.rise{opacity:0}

.chapter .bignum{position:absolute;right:50px;bottom:-110px;font:700 720px/1 var(--display);color:transparent;-webkit-text-stroke:2px rgba(214,177,108,.4);letter-spacing:-.04em}
.chapter .pad{justify-content:center}
.chapter h1{font-size:160px;color:#FBF6EA}
.chapter .lead{max-width:980px}

#hud{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:20;background:linear-gradient(180deg,#0A1530,#0C1938);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(214,177,108,0),rgba(214,177,108,.6),rgba(214,177,108,0)) 1}
#hud img{height:50px}
#hud .r{display:flex;gap:18px;align-items:center}
#chap{font:800 16px/1 var(--body);letter-spacing:.26em;text-transform:uppercase;color:#C9CFDC}
#dayTag{font:800 14px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:#0A1530;background:var(--gold-grad);padding:9px 14px;border-radius:20px}
#score{font:800 18px/1 var(--body);letter-spacing:.1em;color:#E6C98F;padding:12px 18px;border:1px solid rgba(214,177,108,.5);border-radius:40px;background:rgba(255,255,255,.04);display:flex;gap:10px;align-items:center}
#score b{font:600 22px/1 var(--mono);color:#fff}
#score.pop{animation:pop .6s var(--out)}
@keyframes pop{40%{transform:scale(1.18);box-shadow:0 0 40px rgba(214,177,108,.6)}}
#bar{position:absolute;left:0;right:0;bottom:0;height:54px;padding:0 30px;display:flex;align-items:center;gap:14px;z-index:20;background:#0A1530}
#bar button{background:rgba(255,255,255,.06);border:1px solid rgba(214,177,108,.4);color:#F5EFE3;border-radius:10px;height:36px;min-width:42px;font:800 15px/1 var(--body);cursor:pointer;padding:0 14px}
#bar button:hover{border-color:#E6C98F;color:#E6C98F}
#bar #bExit{border-color:rgba(255,120,110,.6);color:#FFB4AC}
#prog{flex:1;height:4px;background:#1c2a52;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .8s var(--out)}
#count{font:600 16px/1 var(--mono);color:#A9B2C8;min-width:80px;text-align:right}
#menu{position:absolute;inset:92px 0 54px;z-index:40;background:rgba(245,241,232,.97);backdrop-filter:blur(14px);display:none;padding:60px 120px;gap:20px;flex-wrap:wrap;align-content:flex-start}
#menu.open{display:flex}
#menu h2{width:100%;margin-bottom:10px}
#menu button{width:calc(33.3% - 14px);text-align:left;background:#fff;border:1px solid #E2D9C4;border-radius:18px;padding:24px 28px;color:#0D1733;cursor:pointer;font:700 26px/1.3 var(--display);transition:.3s;box-shadow:0 10px 30px rgba(13,23,51,.06)}
#menu button span{display:block;font:800 15px/1 var(--body);letter-spacing:.26em;color:#86621A;margin-bottom:10px}
#menu button:hover{border-color:var(--gold);transform:translateY(-4px)}
#morph{position:absolute;inset:0;z-index:15;pointer-events:none}
#laser{position:absolute;inset:0;z-index:60;pointer-events:none}
#stage.lasering,#stage.lasering *{cursor:none!important}
#bar button#bLaser.on{background:#c62828;border-color:#ff6b6b;color:#fff}
#wipe{position:absolute;inset:0;z-index:16;pointer-events:none}
#sparks{position:absolute;inset:0;z-index:14;pointer-events:none;transition:opacity .8s}

/* lightbox */
#lightbox{position:absolute;inset:0;z-index:70;background:rgba(5,11,24,.94);display:none;align-items:center;justify-content:center;padding:70px 90px;cursor:zoom-out}
#lightbox.open{display:flex;animation:lbin .5s var(--out)}
@keyframes lbin{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:lbimg .7s var(--out)}
@keyframes lbimg{from{transform:scale(.9);filter:blur(6px)}to{transform:none;filter:none}}
#lightbox .cap{position:absolute;left:0;right:0;bottom:24px;text-align:center;font:700 24px/1.3 var(--body);color:#F5EFE3}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:24px;flex:1;min-height:0}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qdots{display:flex;gap:10px}.qdots i{width:46px;height:7px;border-radius:4px;background:#DCD3BF;transition:.4s}
.qdots i.cur{background:var(--gold)}.qdots i.ok{background:var(--good)}.qdots i.no{background:var(--bad)}
.qbody{display:flex;gap:40px;flex:1;min-height:0}
.qimg{flex:none;width:560px;border-radius:22px;overflow:hidden;background:#0A1530;box-shadow:0 22px 60px rgba(13,23,51,.18)}
.qimg img{width:100%;height:100%;object-fit:cover;display:block}
.qmain{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.qq{font:600 50px/1.18 var(--display);color:var(--ink);min-height:118px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qopt{display:flex;gap:22px;align-items:center;text-align:left;background:#fff;border:2px solid #E2D9C4;border-radius:18px;padding:22px 28px;color:#0D1733;font:700 26px/1.3 var(--body);cursor:pointer;transition:transform .35s var(--out),border-color .3s,background .3s;box-shadow:0 10px 26px rgba(13,23,51,.06)}
.qopt b{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#E6C98F;font:800 22px/1 var(--body)}
.qopt:hover:not([disabled]){transform:translateY(-4px);border-color:var(--gold)}
.qopt.ok{border-color:var(--good);background:#E6F4EC}.qopt.ok b{background:var(--good);color:#fff}
.qopt.no{border-color:var(--bad);background:#FBE9E6;animation:shake .5s}.qopt.no b{background:var(--bad);color:#fff}
.qopt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.qfb{min-height:90px;font:500 25px/1.5 var(--body);color:var(--ink2);opacity:0;transform:translateY(14px);transition:.6s var(--out);background:#fff;border:1px solid #E2D9C4;border-radius:16px;padding:18px 24px}
.qfb.show{opacity:1;transform:none}
.qnext{align-self:flex-end;opacity:0;pointer-events:none;transition:.4s}
.qnext.show{opacity:1;pointer-events:auto}
.qdone{text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;flex:1}
.burst{position:absolute;pointer-events:none;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* flip cards */
.flip{perspective:1800px;cursor:pointer}
.flip .in{position:relative;height:100%;transition:transform .9s var(--out);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.flip .f{background:#fff;border:1px solid #E2D9C4;box-shadow:0 12px 30px rgba(13,23,51,.07)}
.flip .bk{background:linear-gradient(160deg,#102043,#0A1530);border:1px solid rgba(214,177,108,.5);transform:rotateY(180deg);justify-content:center;padding:26px 28px;gap:12px}
.flip .bk h3{color:#E6C98F;font:700 30px/1.2 var(--display)}
.flip .bk p{font:500 21px/1.5 var(--body);color:#E8EBF2}

/* lesson components */
.flow{display:flex;align-items:stretch;gap:0}
.flow .st{flex:1;position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 24px;box-shadow:0 12px 30px rgba(13,23,51,.06)}
.flow .ar{flex:none;width:46px;display:grid;place-items:center;color:var(--gold);font:800 30px/1 var(--body)}
.flow .st h3{font:800 29px/1.2 var(--body)}
.flow .st p{font:500 22px/1.45 var(--body);color:var(--ink2)}
.flow .st{min-height:330px}
.gal{display:grid;gap:18px;flex:1;min-height:0}
.gal .photo{height:100%}
.def{display:flex;flex-direction:column;gap:6px}
.def dt{font:800 15px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-t)}
.def dd{margin:0;font:600 34px/1.25 var(--display);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b{display:grid;grid-template-columns:220px 1fr 120px;gap:18px;align-items:center;font:700 22px/1 var(--body);color:var(--ink)}
.bars .b .tr{height:30px;background:rgba(13,23,51,.06);border-radius:8px;overflow:hidden}
.bars .b .tr i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#8C9AB8,#5D6C8F);transition:width 1.6s var(--out)}
.bars .b.hi .tr i{background:var(--gold-grad)}
.bars .b .v{font:600 22px/1 var(--mono);color:var(--ink2);text-align:right}
.scene.active .bars .b .tr i{width:var(--w)}
.tl{position:relative;display:flex;justify-content:space-between;padding-top:70px}
.tl::before{content:"";position:absolute;left:0;right:0;top:92px;height:4px;background:linear-gradient(90deg,rgba(181,138,62,.15),var(--gold),rgba(181,138,62,.15));border-radius:2px}
.tl .ev{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tl .ev::before{content:"";width:26px;height:26px;border-radius:50%;background:var(--gold-grad);box-shadow:0 0 0 8px rgba(181,138,62,.18);margin-top:9px}
.tl .ev b{font:700 48px/1 var(--display);color:var(--ink)}
.tl .ev span{font:800 18px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-t)}
.tl .ev p{font:500 19px/1.45 var(--body);color:var(--ink2);max-width:240px}
.check{display:flex;flex-direction:column;gap:14px}
.check li{list-style:none;position:relative;padding-left:50px;font:500 26px/1.45 var(--body);color:var(--ink2)}
.check li::before{content:"";position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:8px;border:2.5px solid var(--gold)}
.check{padding:0;margin:0}
.viewer{position:relative;border-radius:26px;background:radial-gradient(600px 500px at 50% 40%,#1B2C5C 0%,#0A1530 70%);box-shadow:0 30px 80px rgba(10,21,48,.35);overflow:hidden;cursor:grab}
.viewer:active{cursor:grabbing}
.viewer canvas{display:block;width:100%;height:100%}
.viewer .vl{position:absolute;left:28px;bottom:24px;font:800 16px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:#E6C98F}
.viewer .vh{position:absolute;right:24px;top:22px;font:700 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:rgba(230,201,142,.6)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 22px;align-items:baseline}
.kv b{font:800 22px/1.3 var(--body);color:var(--gold-t)}
.kv span{font:500 24px/1.4 var(--body);color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body oncontextmenu="return false">
<div id="viewport"><div id="stage">
