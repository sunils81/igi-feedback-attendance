<style>
/* ===== IGI Team Training (Diamonds 101) — shared components, 2026-11-17 ===== */
.t-film .pad{justify-content:center;gap:28px}
.t-film .reel{position:absolute;right:110px;top:250px;width:640px;height:640px;contain:strict}
.t-film .reel svg{width:100%;height:100%}
.t-film .reel .spin{transform-origin:320px 320px}
.t-watch{display:flex;flex-direction:column;gap:12px;max-width:900px}
.t-watch li{list-style:none;display:flex;gap:16px;align-items:flex-start;font:500 25px/1.45 var(--body);color:#D5DAE6}
.t-watch li b{color:#E6C98F}
.t-watch li::before{content:"◆";color:#D6B16C;font-size:18px;margin-top:6px}
.t-watch{padding:0;margin:0}
.t-dur{font:600 20px/1 var(--mono);color:#E6C98F;border:1px solid rgba(214,177,108,.5);border-radius:30px;padding:10px 16px}

/* did-you-know flip cards */
.t-dyk{display:grid;gap:26px;flex:1;min-height:0}
.t-dyk .flip{min-height:0}
.t-dyk .flip .f{justify-content:center;align-items:center;text-align:center;padding:30px;gap:18px;background:linear-gradient(160deg,#FFFFFF,#FBF6EA)}
.t-dyk .flip .f .q{font:700 40px/1.2 var(--display);color:#0D1733}
.t-dyk .flip .f .ic{font-size:70px;line-height:1}
.t-dyk .flip .f img.pic{max-width:92%;max-height:300px;object-fit:contain}

.t-dyk .flip .f .tap{font:800 15px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:#86621A}
.t-dyk .flip .bk h3{font-size:34px}
.t-dyk .flip .bk p{font-size:23px}
.dark .t-dyk .flip .f{background:rgba(255,255,255,.08);border-color:rgba(214,177,108,.4)}
.dark .t-dyk .flip .f .q{color:#FBF6EA}

/* room vote */
.t-poll{display:flex;flex-direction:column;gap:14px}
.t-poll .opt{position:relative;display:grid;grid-template-columns:56px 1fr 90px;align-items:center;gap:18px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 22px;color:var(--ink);font:700 27px/1.25 var(--body);cursor:pointer;overflow:hidden;transition:border-color .3s,transform .3s var(--out)}
.t-poll .opt:hover{border-color:var(--gold);transform:translateX(6px)}
.t-poll .opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(181,138,62,.16);transition:width .6s var(--out);z-index:0}
.t-poll .opt>*{position:relative;z-index:1}
.t-poll .opt .l{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#E6C98F;font:800 22px/1 var(--body)}
.dark .t-poll .opt .l{background:var(--gold-grad);color:#0A1530}
.t-poll .opt .n{font:600 26px/1 var(--mono);color:var(--muted);text-align:right}
.t-poll .opt.right{border-color:var(--good);background:rgba(31,122,77,.12)}
.t-poll .opt.right .l{background:var(--good);color:#fff}
.t-poll .opt.wrong{opacity:.55}
.t-poll .ctl{display:flex;gap:14px;align-items:center;margin-top:6px}
.t-poll .ctl .btn,.t-sort .btn,.t-mf .btn{white-space:nowrap}
.t-poll .ans{font:500 25px/1.5 var(--body);color:var(--ink2);opacity:0;transform:translateY(10px);transition:.6s var(--out)}
.t-poll .ans.show{opacity:1;transform:none}
.t-hintline{font:700 16px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* sort game */
.t-sort{display:flex;flex-direction:column;gap:22px;flex:1;min-height:0}
.t-sort .pool{display:flex;flex-wrap:wrap;gap:14px;min-height:76px;align-content:flex-start}
.t-sort .chip2{font:700 23px/1.2 var(--body);padding:16px 22px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .3s var(--out),border-color .2s,box-shadow .2s}
.t-sort .chip2:hover{border-color:var(--gold)}
.t-sort .chip2.sel{border-color:var(--gold);box-shadow:0 0 0 5px rgba(181,138,62,.25);transform:translateY(-4px)}
.t-sort .chip2.done{cursor:default;border-color:var(--good);background:rgba(31,122,77,.1)}
.t-sort .chip2.bad{animation:shake .5s}
.t-sort .bins{display:grid;gap:20px;flex:1;min-height:0}
.t-sort .bin{border:2px dashed var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .3s,background .3s;background:var(--card-2);min-height:0}
.t-sort .bin:hover,.t-sort.picking .bin{border-color:var(--gold)}
.t-sort .bin h3{font:800 22px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-t);display:flex;justify-content:space-between}
.t-sort .bin .in{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.t-sort .bin .in .chip2{font-size:19px;padding:10px 14px}
.t-sort .stat{font:700 22px/1 var(--body);color:var(--ink2)}

/* myth or fact */
.t-mf{display:flex;flex-direction:column;align-items:center;gap:30px;flex:1;justify-content:center;text-align:center}
.t-mf .st{font:600 58px/1.2 var(--display);color:var(--ink);max-width:1400px;min-height:150px;display:flex;align-items:center}
.t-mf .btns{display:flex;gap:30px}
.t-mf .btns button{font:800 30px/1 var(--body);letter-spacing:.12em;padding:26px 54px;border-radius:50px;border:3px solid;cursor:pointer;background:transparent;transition:transform .3s var(--out)}
.t-mf .btns button:hover{transform:translateY(-5px)}
.t-mf .btns .m{color:#C0392B;border-color:#C0392B}.t-mf .btns .f{color:#1F7A4D;border-color:#1F7A4D}
.dark .t-mf .btns .m{color:#FF8A7A;border-color:#FF8A7A}.dark .t-mf .btns .f{color:#6FD39B;border-color:#6FD39B}
.t-mf .why{font:500 28px/1.5 var(--body);color:var(--ink2);max-width:1300px;min-height:90px;opacity:0;transition:.5s var(--out)}
.t-mf .why.show{opacity:1}
.t-mf .verdict{font:800 26px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;min-height:30px}
.t-mf .meta{display:flex;gap:24px;align-items:center;font:700 20px/1 var(--body);color:var(--muted)}

/* generic tabs/panels */
.t-panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 32px;display:flex;flex-direction:column;gap:12px}
.t-panel h3{font:700 40px/1.15 var(--display)}
.t-panel .tag{font:800 15px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-t)}
.t-big{font:700 92px/1 var(--display);color:var(--ink)}
.t-range{width:100%;-webkit-appearance:none;appearance:none;height:14px;border-radius:8px;background:linear-gradient(90deg,#E6C98F,#B58A3E);outline:none;cursor:pointer}
.t-range::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:#0A1530;border:4px solid #F0D9A6;box-shadow:0 6px 18px rgba(10,21,48,.35);cursor:grab}
.t-range::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:#0A1530;border:4px solid #F0D9A6;cursor:grab}
.dark .t-range::-webkit-slider-thumb{background:#F0D9A6;border-color:#0A1530}
.t-tick{display:flex;justify-content:space-between;font:700 18px/1 var(--body);color:var(--muted);margin-top:10px}
.t-hot{cursor:pointer}
.t-hot:hover{filter:brightness(1.1)}
.t-small-note{font:600 16px/1.4 var(--body);color:var(--muted);letter-spacing:.04em}
.t-num-row{display:grid;gap:22px}
.t-stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.t-stat b{font:700 70px/1 var(--display);color:var(--gold-t)}
.t-stat span{font:600 22px/1.4 var(--body);color:var(--ink2)}

/* ---- pop-up glossary (2026-11-18) ---- */
.t-term{border-bottom:2px dotted #B58A3E;cursor:help;transition:background .2s;border-radius:3px}
.t-term:hover{background:rgba(181,138,62,.16)}
.dark .t-term{border-bottom-color:#E6C98F}
.t-pop{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,11,24,.45);background:rgba(5,11,24,.6)}
.t-pop.on{display:flex}
.t-pop .card2{width:760px;max-width:80%;background:#0A1530;color:#E9ECF4;border:1px solid rgba(214,177,108,.5);border-radius:26px;padding:36px 42px;box-shadow:0 40px 90px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:16px;animation:tpop .45s cubic-bezier(.16,1,.3,1)}
@keyframes tpop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.t-pop .k{font:800 15px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:#E6C98F}
.t-pop h3{font:700 54px/1.05 var(--display);color:#FBF6EA}
.t-pop p{font:500 27px/1.5 var(--body);color:#D5DAE6}
.t-pop p b{color:#F0D9A6}
.t-pop img{max-height:300px;align-self:center;border-radius:14px}
.t-pop .x{position:absolute;margin-left:640px;margin-top:-20px;font:700 30px/1 var(--body);color:#E6C98F;background:none;border:0;cursor:pointer}
.t-pop .hint{font:600 15px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
</style>
