<script>
/* IGI Team Training — shared interactive components (room vote, sort game, myth or fact). 2026-11-17 */
(function(){
 var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
 var L='ABCDEF';
 function stop(e){e.stopPropagation()}
 /* ---- room vote: tap an option once per raised hand, then Reveal ---- */
 $$('.t-poll').forEach(function(box){
  var opts=JSON.parse(box.getAttribute('data-opts')),ans=+box.getAttribute('data-ans'),why=box.getAttribute('data-why')||'';
  var n=opts.map(function(){return 0});
  box.innerHTML=opts.map(function(o,k){return '<button type="button" class="opt" data-k="'+k+'"><i class="bar"></i><span class="l">'+L[k]+'</span><span>'+o+'</span><span class="n">0</span></button>'}).join('')+
   '<div class="ctl"><button type="button" class="btn" data-r>Reveal the answer</button><button type="button" class="btn ghost" data-z>↺ Reset</button></div><div class="ans">'+why+'</div>';
  function draw(){var t=n.reduce(function(a,b){return a+b},0)||1;$$('.opt',box).forEach(function(b,k){b.querySelector('.n').textContent=n[k];b.querySelector('.bar').style.width=(n[k]/t*100)+'%'})}
  $$('.opt',box).forEach(function(b){b.addEventListener('click',function(e){stop(e);n[+b.dataset.k]++;draw()});b.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();var k=+b.dataset.k;if(n[k]>0)n[k]--;draw()})});
  box.querySelector('[data-r]').addEventListener('click',function(e){stop(e);$$('.opt',box).forEach(function(b,k){b.classList.toggle('right',k===ans);b.classList.toggle('wrong',k!==ans)});box.querySelector('.ans').classList.add('show');if(window.tGlossWrap&&!box.__gw){box.__gw=1;window.tGlossWrap(box.querySelector('.ans'))}});
  box.querySelector('[data-z]').addEventListener('click',function(e){stop(e);n=n.map(function(){return 0});$$('.opt',box).forEach(function(b){b.classList.remove('right','wrong')});box.querySelector('.ans').classList.remove('show');draw()});
 });
 /* ---- sort game: tap a card, then tap the right box ---- */
 $$('.t-sort').forEach(function(box){
  var bins=JSON.parse(box.getAttribute('data-bins')),items=JSON.parse(box.getAttribute('data-items')),sel=null;
  function build(){
   var order=items.map(function(x,i){return i}).sort(function(){return Math.random()-.5});
   box.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><span class="t-hintline">Which box does each card belong in?</span><span class="stat"></span></div><div class="pool">'+
    order.map(function(i){return '<button type="button" class="chip2" data-i="'+i+'">'+items[i][0]+'</button>'}).join('')+'</div>'+
    '<div class="bins" style="grid-template-columns:repeat('+bins.length+',1fr)">'+bins.map(function(b,k){return '<div class="bin" data-b="'+k+'"><h3><span>'+b+'</span><span class="c">0</span></h3><div class="in"></div></div>'}).join('')+'</div>'+
    '<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-z>↺ Shuffle and start again</button></div>';
   sel=null;stat();
   $$('.pool .chip2',box).forEach(function(c){c.addEventListener('click',function(e){stop(e);if(c.classList.contains('done'))return;$$('.chip2.sel',box).forEach(function(x){x.classList.remove('sel')});sel=c;c.classList.add('sel');box.classList.add('picking')})});
   $$('.bin',box).forEach(function(b){b.addEventListener('click',function(e){stop(e);if(!sel)return;var i=+sel.dataset.i,k=+b.dataset.b;
    if(items[i][1]===k){sel.classList.remove('sel');sel.classList.add('done');b.querySelector('.in').appendChild(sel);if(items[i][2]){sel.title=items[i][2]}sel=null;box.classList.remove('picking');stat()}
    else{var s=sel;s.classList.remove('bad');void s.offsetWidth;s.classList.add('bad')}})});
   box.querySelector('[data-z]').addEventListener('click',function(e){stop(e);build()});
  }
  function stat(){var d=$$('.chip2.done',box).length;box.querySelector('.stat').textContent=d+' of '+items.length+' sorted'+(d===items.length?' · well done!':'');$$('.bin',box).forEach(function(b){b.querySelector('.c').textContent=b.querySelectorAll('.chip2').length})}
  build();
 });
 /* ---- myth or fact ---- */
 $$('.t-mf').forEach(function(box){
  var items=JSON.parse(box.getAttribute('data-items')),i=0,score=0,done=false;
  box.innerHTML='<div class="meta"><span class="cnt"></span><span>Score <b class="sc">0</b></span></div><div class="st"></div><div class="btns"><button type="button" class="m">✕ MYTH</button><button type="button" class="f">✓ FACT</button></div><div class="verdict"></div><div class="why"></div><div class="row" style="gap:16px"><button type="button" class="btn" data-n style="visibility:hidden">Next statement →</button><button type="button" class="btn ghost" data-z>↺ Start again</button></div>';
  var st=box.querySelector('.st'),why=box.querySelector('.why'),vd=box.querySelector('.verdict'),nx=box.querySelector('[data-n]');
  function show(){done=false;var it=items[i];st.textContent='“'+it[0]+'”';why.classList.remove('show');why.innerHTML='';vd.textContent='';nx.style.visibility='hidden';box.querySelector('.cnt').textContent='Statement '+(i+1)+' of '+items.length;box.querySelector('.sc').textContent=score;
   st.animate([{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.16,1,.3,1)'})}
  function pick(f){if(done)return;done=true;var it=items[i],ok=(f===it[1]);if(ok)score++;box.querySelector('.sc').textContent=score;
   vd.textContent=(it[1]?'✓ Fact':'✕ Myth')+(ok?' · correct':' · caught out');vd.style.color=it[1]?'var(--good)':'var(--bad)';
   why.innerHTML=it[2];if(window.tGlossWrap)window.tGlossWrap(why);why.classList.add('show');nx.style.visibility='visible';nx.textContent=i<items.length-1?'Next statement →':'See the score →'}
  box.querySelector('.m').addEventListener('click',function(e){stop(e);pick(false)});
  box.querySelector('.f').addEventListener('click',function(e){stop(e);pick(true)});
  nx.addEventListener('click',function(e){stop(e);if(i<items.length-1){i++;show()}else{st.textContent='Score: '+score+' of '+items.length;why.innerHTML=score===items.length?'Perfect. Nobody can fool this team.':'Every myth we bust is trust earned.';why.classList.add('show');vd.textContent='';nx.style.visibility='hidden'}});
  box.querySelector('[data-z]').addEventListener('click',function(e){stop(e);i=0;score=0;show()});
  show();
 });
 /* ---- generic "pick one, show its text" explorer: buttons with data-x inside [data-explore] set the target's HTML ---- */
 $$('[data-explore]').forEach(function(box){
  var out=box.querySelector('[data-out]');
  $$('[data-x]',box).forEach(function(b){b.addEventListener('click',function(e){stop(e);$$('[data-x]',box).forEach(function(x){x.classList.toggle('on',x===b)});
   var tpl=box.querySelector('template[data-for="'+b.getAttribute('data-x')+'"]');if(tpl&&out){out.innerHTML=tpl.innerHTML;out.querySelectorAll('img[data-lz]').forEach(function(i){i.src=i.getAttribute('data-lz');i.removeAttribute('data-lz')});if(window.tGlossWrap)window.tGlossWrap(out);out.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.16,1,.3,1)'})}
   if(box.dataset.explore&&window[box.dataset.explore])window[box.dataset.explore](b.getAttribute('data-x'),box)})});
  var first=box.querySelector('[data-x].on')||null;if(first)first.click();
 });
})();
</script>
<script>
/* Pop-up glossary: the first mention of each term on a slide is underlined; click it for a plain-English definition. 2026-11-18 */
(function(){
 var G=window.TGLOSS||{},idx=[];
 Object.keys(G).forEach(function(k){(G[k][2]||[]).forEach(function(w){idx.push([w,k])})});
 idx.sort(function(a,b){return b[0].length-a[0].length});
 function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
 var RE=new RegExp('(^|[^A-Za-z0-9\\-])('+idx.map(function(x){return esc(x[0])}).join('|')+')(?![A-Za-z0-9])','i');
 var KEY={};idx.forEach(function(x){KEY[x[0].toLowerCase()]=x[1]});
 var SKIP='h1,h2,.kt,.kc,button,svg,script,style,a,.t-term,.chip,.eyebrow,.num,.bignum,.seg,input,textarea,.t-pop,.t-hintline,.tag,.t-big,.k,.vl,.quiz,.t-poll .opt,.t-sort,.price,.t-dur';
 function wrap(root,used){
  used=used||{};
  var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentElement;if(!p||p.closest(SKIP))return NodeFilter.FILTER_REJECT;return /[A-Za-z]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  var nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(function(n){
   var guard=0;
   while(n&&guard++<20){
    var s=n.nodeValue,m,off=0,found=null,sub=s;
    while((m=RE.exec(sub))){var w=m[2],k=KEY[w.toLowerCase()];var at=off+m.index+m[1].length;if(!used[k]){found=[at,w,k];break}off=at+w.length;sub=s.slice(off)}
    if(!found)break;
    used[found[2]]=1;
    var after=n.splitText(found[0]);var rest=after.splitText(found[1].length);
    var sp=document.createElement('span');sp.className='t-term';sp.setAttribute('data-g',found[2]);sp.textContent=after.nodeValue;after.parentNode.replaceChild(sp,after);
    n=rest;
   }
  });
  return used;
 }
 window.tGlossWrap=wrap;
 document.querySelectorAll('section.scene').forEach(function(sc){if(!sc.classList.contains('chapter'))sc.__tg=wrap(sc)});
 var pop=null;
 function show(k){var g=G[k];if(!g)return;var sc=document.querySelector('section.scene');var host=sc.parentElement;
  if(!pop){pop=document.createElement('div');pop.className='t-pop';host.appendChild(pop)}
  pop.innerHTML='<div class="card2"><span class="k">Glossary</span><h3>'+g[0]+'</h3><p>'+g[1]+'</p>'+(g[3]?'<img src="'+g[3]+'" alt="">':'')+'<span class="hint">Click anywhere to close</span></div>';
  pop.classList.add('on')}
 document.addEventListener('click',function(e){
  if(pop&&pop.classList.contains('on')){e.stopPropagation();e.preventDefault();pop.classList.remove('on');return}
  var t=e.target.closest&&e.target.closest('.t-term');if(t){e.stopPropagation();e.preventDefault();show(t.getAttribute('data-g'))}
 },true);
 document.querySelectorAll('section.scene').forEach(function(sc){sc.addEventListener('scene-enter',function(){if(pop)pop.classList.remove('on')})});
 document.addEventListener('keydown',function(e){if(pop&&pop.classList.contains('on')){if(e.key==='Escape'||e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key===' '){e.stopPropagation();e.preventDefault();pop.classList.remove('on')}}},true);
})();
</script>
