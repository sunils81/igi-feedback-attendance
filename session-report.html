<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IGI — Session Report</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="assets/shared.js?v=69"></script>
<style id="dyn-css"></style>
<style>
.att-table{width:100%;border-collapse:collapse;font-size:13px}
.att-table th{padding:8px 10px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--border)}
.att-table td{padding:9px 10px;border-bottom:1px solid var(--off);vertical-align:middle}
.att-table tr:last-child td{border-bottom:none}
.att-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.streak-bar{height:6px;background:var(--off);border-radius:3px;overflow:hidden;margin-top:3px;width:80px}
.streak-fill{height:6px;border-radius:3px}
.topic-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--off)}
.topic-row:last-child{border-bottom:none}
.topic-num{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:var(--gold);width:32px;flex-shrink:0;margin-top:2px}
.topic-info .ti{font-size:13px;font-weight:600;color:var(--navy)}
.topic-info .tm{font-size:11px;color:var(--muted);margin-top:2px}
.sess-sel{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:"Plus Jakarta Sans",sans-serif;font-size:14px;background:var(--white);color:var(--navy);outline:none}
.absent-row{background:#FEF2F2}
.wa-btn{font-size:11px;padding:4px 10px;background:transparent;border:1px solid #25D366;color:#25D366;border-radius:5px;cursor:pointer;white-space:nowrap;font-family:"Plus Jakarta Sans",sans-serif}
.wa-btn:hover{background:#25D366;color:#fff}
.risk-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--red);background:#FEF2F2;padding:2px 7px;border-radius:10px}
</style>
</head>
<body>
<script>document.getElementById('dyn-css').textContent=CSS_VARS;</script>

<div class="wrap">
  <div class="site-header">
    <div class="hdr-logo"><img src="assets/igi-school-of-gemology-white-logo.svg"></div>
    <div class="hdr-divider"></div>
    <div class="hdr-band">
      <div class="hdr-label">Session Report</div>
      <div class="hdr-sub">Attendance & Topic Log</div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="s-login" class="screen active">
    <div class="card">
      <div class="section-tag">Access Report</div>
      <h2>Session Attendance Report</h2>
      <p class="sub">Enter your batch code and the standard IGI report password to view attendance.</p>
      <div class="field"><label>Batch Code *</label>
        <input type="text" id="lg-batch" placeholder="e.g. MUM-DG-MAY26" style="text-transform:uppercase">
      </div>
      <div class="field"><label>Report Password *</label>
        <input type="password" id="lg-pass" placeholder="Enter report password">
      </div>
      <button class="btn btn-gold" id="lg-btn" onclick="loadReport()">View Report →</button>
      <div class="err-box" id="lg-err"></div>
    </div>
  </div>

  <!-- REPORT -->
  <div id="s-report" class="screen">
    <div class="card" style="background:var(--navy);padding:18px 20px;margin-bottom:4px">
      <div style="font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Batch Report</div>
      <div style="font-size:16px;font-weight:600;color:var(--white)" id="rp-title">—</div>
      <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:4px" id="rp-meta">—</div>
    </div>

    <div class="tab-bar">
      <button class="tab active" onclick="rpTab('rp-session')">📅 Session</button>
      <button class="tab" onclick="rpTab('rp-streak')">📊 Streak</button>
      <button class="tab" onclick="rpTab('rp-topics')">📖 Topics</button>
    </div>

    <!-- Session Attendance -->
    <div id="rp-session" class="tab-content active">
      <div class="card">
        <div class="section-tag">Session Attendance</div>
        <div class="field" style="margin-bottom:16px">
          <label>Select Session</label>
          <select class="sess-sel" id="sess-sel" onchange="renderSessionAttendance()">
            <option value="">Select a session</option>
          </select>
        </div>
        <div id="sess-att-wrap"></div>
      </div>
    </div>

    <!-- Streak -->
    <div id="rp-streak" class="tab-content">
      <div class="card">
        <div class="section-tag">Attendance Streak</div>
        <h2 id="streak-title">All Students</h2>
        <div id="streak-wrap"></div>
      </div>
    </div>

    <!-- Topic Log -->
    <div id="rp-topics" class="tab-content">
      <div class="card">
        <div class="section-tag">Curriculum Delivery Log</div>
        <h2>Topics Covered</h2>
        <div id="topics-wrap"></div>
      </div>
    </div>

  </div><!-- /s-report -->
</div>

<script>

// ── Fallback Money Formatting Utilities (in case of cached shared.js) ──
if (typeof money === 'undefined') {
  window.money = function(v) {
    return '₹' + Math.round(Number(v) || 0).toLocaleString('en-IN');
  };
}
if (typeof moneyShort === 'undefined') {
  window.moneyShort = function(v) {
    const val = Number(v) || 0;
    if (val >= 10000000) {
      return '₹' + (val / 10000000).toFixed(2) + ' Cr';
    } else if (val >= 100000) {
      return '₹' + (val / 100000).toFixed(2) + 'L';
    }
    return '₹' + Math.round(val).toLocaleString('en-IN');
  };
}
if (typeof amtL === 'undefined') {
  window.amtL = function(v) {
    v = Number(v)||0;
    if (v >= 10000000) return '₹'+(v/10000000).toFixed(2)+'Cr';
    if (v >= 100000)   return '₹'+(v/100000).toFixed(2)+'L';
    if (v >= 1000)     return '₹'+(v/1000).toFixed(1)+'K';
    return '₹'+v;
  };
}

let reportData = null;

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('lg-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') loadReport(); });
  const params = new URLSearchParams(window.location.search);
  if (params.get('b')) document.getElementById('lg-batch').value = params.get('b').toUpperCase();
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function rpTab(id) {
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const idx = ['rp-session','rp-streak','rp-topics'].indexOf(id);
  document.querySelectorAll('.tab')[idx].classList.add('active');
}

function loadReport() {
  const batch     = document.getElementById('lg-batch').value.trim().toUpperCase();
  const reportPass= document.getElementById('lg-pass').value.trim();
  const errEl     = document.getElementById('lg-err');
  const btn       = document.getElementById('lg-btn');
  errEl.classList.remove('show');
  if (!batch||!reportPass) { errEl.textContent='Please fill both fields.'; errEl.classList.add('show'); return; }
  btn.textContent='Loading…'; btn.disabled=true;
  gasGet({action:'getSessionReport',batchCode:batch,reportPass},function(e,d){
    btn.textContent='View Report →'; btn.disabled=false;
    if (e||!d||d.status!=='ok') {
      const msgs={batch_not_found:'Batch not found.',wrong_password:'Incorrect password.'};
      errEl.textContent=msgs[d&&d.reason]||'Could not load report.'; errEl.classList.add('show'); return;
    }
    reportData = d;
    renderReport(d);
    showScreen('s-report');
  });
}

function renderReport(d) {
  document.getElementById('rp-title').textContent = d.batch.batchCode + ' — ' + d.batch.course;
  document.getElementById('rp-meta').textContent  =
    d.batch.centre + ' · ' + d.batch.type + ' · ' +
    d.totalStudents + ' students · ' + d.totalSessions + ' sessions';

  // Session dropdown
  const sel = document.getElementById('sess-sel');
  sel.innerHTML = '<option value="">Select a session</option>';
  d.sessions.forEach(s=>{
    const o = document.createElement('option');
    o.value = s.sessionCode;
    o.textContent = 'S' + String(s.displaySessNo || s.sessNo).padStart(2,'0') + ' — ' + s.sessionDate + ' — ' + s.topic;
    sel.appendChild(o);
  });
  // Auto-select most recent
  if (d.sessions.length) {
    sel.value = d.sessions[d.sessions.length-1].sessionCode;
    renderSessionAttendance();
  }

  // Streak
  renderStreak(d);

  // Topics
  renderTopics(d);
}

function renderSessionAttendance() {
  const code = document.getElementById('sess-sel').value;
  const wrap = document.getElementById('sess-att-wrap');
  if (!code||!reportData) { wrap.innerHTML=''; return; }
  const sess = reportData.sessions.find(s=>s.sessionCode===code);
  const allStu = reportData.students;

  // Find who submitted feedback for this session
  const attendedMap = {};
  allStu.forEach(s=>{
    const a = s.attendedSessions.find(as=>as.sessionCode===code);
    attendedMap[s.enrollmentNo] = a ? a.attended : false;
  });

  const present = allStu.filter(s=>attendedMap[s.enrollmentNo]);
  const absent  = allStu.filter(s=>!attendedMap[s.enrollmentNo]);

  wrap.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div style="flex:1;min-width:100px;background:#E8F5EE;border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:#1a7a3c">${present.length}</div>
        <div style="font-size:11px;color:#1a7a3c;font-weight:600">Present</div>
      </div>
      <div style="flex:1;min-width:100px;background:#FEF2F2;border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--red)">${absent.length}</div>
        <div style="font-size:11px;color:var(--red);font-weight:600">Absent</div>
      </div>
      <div style="flex:1;min-width:100px;background:var(--off);border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--navy)">${allStu.length>0?Math.round((present.length/allStu.length)*100):0}%</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600">Attendance</div>
      </div>
    </div>
    <table class="att-table">
      <thead><tr>
        <th>Student</th><th>Enrollment No.</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${allStu.map(s=>{
          const att = attendedMap[s.enrollmentNo];
          return `<tr class="${att?'':'absent-row'}">
            <td><strong>${s.name}</strong></td>
            <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">${s.enrollmentNo}</td>
            <td>${att
              ? '<span class="badge badge-green">✓ Present</span>'
              : '<span class="badge badge-red">✗ Absent</span>'}</td>
            <td>${!att
              ? `<button class="wa-btn" onclick="sendWA('${s.name}','${sess?sess.topic:''}')">📲 WhatsApp</button>`
              : ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function sendWA(name, topic) {
  const msg = `Hi ${name}, we missed you at today's IGI lecture on "${topic}". Please check with your counselor about the session notes. See you next time! 🙏`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function renderStreak(d) {
  const wrap = document.getElementById('streak-wrap');
  document.getElementById('streak-title').textContent = d.totalStudents + ' students · ' + d.totalSessions + ' sessions';
  if (!d.students.length) { wrap.innerHTML='<p style="color:var(--muted);font-size:13px">No student data yet.</p>'; return; }
  wrap.innerHTML = `<table class="att-table">
    <thead><tr>
      <th>Student</th><th>Attended</th><th>Streak</th><th>Status</th>
    </tr></thead>
    <tbody>
      ${d.students.map(s=>`<tr>
        <td>
          <div style="font-weight:600">${s.name}</div>
          <div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted)">${s.enrollmentNo}</div>
        </td>
        <td style="font-family:'JetBrains Mono',monospace;font-weight:600">${s.attended}/${s.total}</td>
        <td>
          <div style="font-size:12px;font-weight:600;color:${s.streakPct>=75?'#1a7a3c':s.streakPct>=50?'#B87A10':'var(--red)'}">${s.streakPct}%</div>
          <div class="streak-bar">
            <div class="streak-fill" style="width:${s.streakPct}%;background:${s.streakPct>=75?'#1a7a3c':s.streakPct>=50?'#C9A84C':'var(--red)'}"></div>
          </div>
        </td>
        <td>${s.atRisk?'<span class="risk-flag">⚠ At Risk</span>':'<span style="font-size:11px;color:var(--muted)">—</span>'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderTopics(d) {
  const wrap = document.getElementById('topics-wrap');
  if (!d.sessions.length) { wrap.innerHTML='<p style="color:var(--muted);font-size:13px">No sessions yet.</p>'; return; }
  const typeColors = {'Scheduled':'#1a7a3c','Saturday Extra':'#B87A10','Extended':'#C94A4A','Makeup':'#185FA5','Cancelled':'#dc2626'};
  wrap.innerHTML = [...d.sessions].sort((a,b)=>a.sessNo-b.sessNo).map(s=>`
    <div class="topic-row">
      <div class="topic-num">S${String(s.displaySessNo || s.sessNo).padStart(2,'0')}</div>
      <div class="topic-info">
        <div class="ti">${s.topic||'<span style="color:var(--muted);font-style:italic">Topic not yet set</span>'}</div>
        <div class="tm">${s.sessionDate} · ${s.instructor}
          <span style="font-size:10px;font-weight:700;color:${typeColors[s.sessionType]||'var(--muted)'};margin-left:6px">${s.sessionType||'Scheduled'}</span>
        </div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
